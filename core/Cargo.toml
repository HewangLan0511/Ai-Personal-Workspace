[package]
name = "personal-workspace-core"
version = "0.1.0"
description = "Personal Workspace 桌面核心（Tauri 宿主 + 调度引擎）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process", "io-util"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
# 本地时区 ISO8601（契约 3.1 / 3.3 要求带偏移）：引入 chrono 取本地时间
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 阶段8：硬件指标与进程列表用 Win32 API 手写（11 §B2/B3）——
# 不引入 sysinfo： crates.io 在本机不可达（代理），且 Win32 直调更符合 ADR-001
# "能力归 Rust 本机 API" 的口径。GPU/温度 Windows 无通用 WMI 通道，如实不提供。
toml = "0.8"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ADR-001：窗口控制与进程启动统一用 Rust（docs/adr/ADR-001）。
# 阶段3 将启用以下 features 实现窗口能力；阶段1 先声明依赖便于工具链补验。
[target.'cfg(windows)'.dependencies.windows]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",                    # SetProcessDpiAwarenessContext（阶段3 验收项 8）
    "Win32_UI_Input_KeyboardAndMouse",   # AttachThreadInput（阶段3 §3 前台锁定）
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",   # GlobalMemoryStatusEx / GetSystemTimes（阶段8 §B2）
    "Win32_Storage_FileSystem",         # GetDiskFreeSpaceExW（阶段8 §B2 磁盘占用）
]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
