<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Personal Workspace — 高保真 UI 原型</title>
<style>
/* ==========================================================================
   1. TOKENS（与 tokens.css 同源，此处内联以保证单文件可独立预览）
   ========================================================================= */
:root{
  --bg-app:#EBEDF1; --bg-app-hover:#E4E7EC; --bg-canvas:#F4F5F8; --bg-sunken:#E9EBF0;
  --surface-1:#FFFFFF; --surface-2:#F8F9FB; --surface-3:#F1F3F6; --surface-hover:#F5F6F9; --surface-inset:#EDEFF3;
  --surface-overlay:#FFFFFF; --scrim:rgba(20,23,28,.32);
  --border-subtle:#EDEFF3; --border:#E1E4EA; --border-strong:#CDD2DC; --border-focus:#6E8BE6;
  --brand-50:#EFF3FD; --brand-100:#DFE7FB; --brand-200:#C4D2F7; --brand-300:#9DB3F0;
  --brand-400:#6F8CE6; --brand-500:#4A6BDC; --brand-600:#3A57C4; --brand-700:#2E45A0; --brand-contrast:#FFF;
  --success:#2E9C6E; --success-soft:#E7F5EF; --success-text:#1F7351;
  --warning:#C08A1E; --warning-soft:#FAF2E0; --warning-text:#8A6116;
  --danger:#CE4A3F; --danger-soft:#FBECEA; --danger-text:#A03329;
  --info:#4A6BDC; --info-soft:#EFF3FD;
  --text-1:#14171C; --text-2:#565E6E; --text-3:#737B8A; --text-4:#9BA2AF; --text-on-brand:#FFF;
  --app-tint-1:#E8EEFB; --app-ink-1:#3A57C4;
  --app-tint-2:#E7F5EF; --app-ink-2:#1F7351;
  --app-tint-3:#FAF2E0; --app-ink-3:#8A6116;
  --app-tint-4:#F3EDFB; --app-ink-4:#5B3FA8;
  --app-tint-5:#FBECEA; --app-ink-5:#A03329;
  --app-tint-6:#E9F3F7; --app-ink-6:#1F6279;
  --font-ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-display:"Segoe UI Variable Display","Segoe UI Variable Text","Segoe UI",system-ui,"PingFang SC","Microsoft YaHei UI",sans-serif;
  --font-mono:"Cascadia Mono",ui-monospace,"SF Mono",Consolas,monospace;
  --fs-display:26px; --lh-display:34px; --ls-display:-.022em;
  --fs-page:20px; --lh-page:28px; --ls-page:-.014em;
  --fs-section:15px; --lh-section:22px; --ls-section:-.006em;
  --fs-card:14px; --lh-card:20px; --ls-card:-.003em;
  --fs-body:14px; --lh-body:22px; --fs-body-sm:13px; --lh-body-sm:20px;
  --fs-caption:12px; --lh-caption:18px; --fs-label:11px; --lh-label:16px; --ls-label:.06em;
  --fs-num-lg:22px; --lh-num-lg:28px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px; --space-16:64px;
  --gap-inline:8px; --gap-stack:12px; --gap-card:20px; --gap-section:32px;
  --pad-card:20px; --pad-card-lg:24px; --pad-page-x:32px; --pad-page-t:28px;
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-2xl:20px; --r-full:999px;
  --shadow-xs:0 1px 2px rgba(18,22,33,.04);
  --shadow-sm:0 1px 2px rgba(18,22,33,.05),0 1px 1px rgba(18,22,33,.03);
  --shadow-md:0 4px 12px -2px rgba(18,22,33,.07),0 2px 4px -2px rgba(18,22,33,.05);
  --shadow-lg:0 16px 40px -8px rgba(18,22,33,.14),0 4px 12px -4px rgba(18,22,33,.06);
  --shadow-inset:inset 0 1px 0 rgba(255,255,255,.7);
  --ease-out:cubic-bezier(.22,.61,.36,1); --ease-inout:cubic-bezier(.4,0,.2,1);
  --dur-micro:120ms; --dur-fast:160ms; --dur-base:220ms; --dur-slow:300ms;
  --titlebar-h:44px; --sidebar-w:236px; --sidebar-w-mini:64px; --topbar-h:56px; --appbar-h:46px;
  --widget-w:224px;
  --ai-panel-w:360px; --content-max:1120px; --panel-inset:10px;
  --z-drawer:60; --z-modal:70; --z-toast:80; --z-tip:90;
}
[data-theme="dark"]{
  --bg-app:#0D0F12; --bg-app-hover:#171A1F; --bg-canvas:#14171B; --bg-sunken:#0F1216;
  --surface-1:#1A1E24; --surface-2:#1F242B; --surface-3:#232830; --surface-hover:#212630; --surface-inset:#131619;
  --surface-overlay:#1C2128; --scrim:rgba(0,0,0,.55);
  --border-subtle:#23282F; --border:#2C323A; --border-strong:#3B424C;
  --brand-50:#1B2340; --brand-100:#223055; --brand-200:#2E3F6E; --brand-300:#4E68AE;
  --brand-400:#6F8CE6; --brand-500:#7E99EC; --brand-600:#93AAEF; --brand-700:#B3C3F5; --brand-contrast:#10131A;
  --success:#4FB98C; --success-soft:#16302A; --success-text:#7FD1AC;
  --warning:#D3A748; --warning-soft:#302816; --warning-text:#E2C283;
  --danger:#E0705F; --danger-soft:#33211F; --danger-text:#EE9C8F;
  --text-1:#E9EBEF; --text-2:#A7AEB9; --text-3:#868E9B; --text-4:#6A717C; --text-on-brand:#10131A;
  --app-tint-1:#22305A; --app-ink-1:#A8BCF5;
  --app-tint-2:#16302A; --app-ink-2:#7FD1AC;
  --app-tint-3:#302816; --app-ink-3:#E2C283;
  --app-tint-4:#2A2140; --app-ink-4:#C0ACEF;
  --app-tint-5:#33211F; --app-ink-5:#EE9C8F;
  --app-tint-6:#16303A; --app-ink-6:#8FC9DE;
  --shadow-xs:0 1px 2px rgba(0,0,0,.4);
  --shadow-sm:0 1px 2px rgba(0,0,0,.45),0 1px 1px rgba(0,0,0,.3);
  --shadow-md:0 4px 12px -2px rgba(0,0,0,.5),0 2px 4px -2px rgba(0,0,0,.35);
  --shadow-lg:0 16px 40px -8px rgba(0,0,0,.65),0 4px 12px -4px rgba(0,0,0,.4);
  --shadow-inset:inset 0 1px 0 rgba(255,255,255,.04);
}
/* ==========================================================================
   1.5 MOTION TOKENS
   ★ Duration（节奏）与 Intensity（幅度）是两个独立维度：
     - --mt-dur-*  只决定"动多久"
     - --mt-intensity + --mt-dist/scale/fade  只决定"动多少"
     禁止把两者相乘。默认值按 UI-01 规格给定。
   ========================================================================== */
:root{
  /* ---------- 维度一：Duration 节奏 ---------- */
  --mt-dur-press:    80ms;    /* 按下 60–90 */
  --mt-dur-hover:   140ms;    /* hover 120–160 */
  --mt-dur-drag:    100ms;    /* grab 80–120 */
  --mt-dur-reorder: 160ms;    /* 邻居让位 120–180 */
  --mt-dur-drop:    160ms;    /* drop snap 120–180 */
  --mt-dur-highlight:460ms;   /* 落位成功高亮 */
  --mt-dur-scene-out: 80ms;   /* 页面离场 */
  --mt-dur-scene-in: 140ms;   /* 页面入场（总 160–220） */
  --mt-dur-window:  200ms;    /* Cinema 窗口落位 160–220 */
  --mt-dur-toast-in: 180ms;   /* Toast 160–200 */
  --mt-dur-toast-out:120ms;   /* Toast 100–140 */
  --mt-dur-ctx:     100ms;    /* 右键菜单 80–120 */
  --mt-dur-drawer:  240ms;    /* 抽屉 220–280 */
  --mt-dur-modal-bg:140ms;    /* 弹窗遮罩 120–160 */
  --mt-dur-modal:   180ms;    /* 弹窗 160–200 */
  --mt-dur-ai:      260ms;    /* AI 展开 240–300 */
  --mt-dur-ai-out:  200ms;    /* AI 收起 180–240 */
  --mt-dur-nav:     260ms;    /* 主侧栏展开 240–300 */
  --mt-dur-nav-out: 200ms;    /* 主侧栏收起 180–240 */
  /* 拖到最小值后的"停顿多久才折叠"。这是交互节奏不是装饰动画，
     所以不随 reduced / off 降级 —— 降级后误触折叠更难受。
     560ms：折叠是有破坏性的状态切换，中间态（蓄力）必须能被用户看见并来得及反悔。 */
  --mt-dur-dwell:   560ms;
  --mt-dur-perm:    140ms;    /* 权限条 100–160 */
  --mt-dur-entrance:200ms;    /* 首入 Hero 180–220 */
  --mt-dur-entrance-ws:220ms; /* 首入 Workspace 180–240 */
  --mt-dur-entrance-2:180ms;  /* 首入 Secondary 160–200 */
  --mt-stagger:      24ms;    /* 首入 20–30 */
  --mt-dur-ambient: 600ms;    /* 仅 loading 循环 */

  /* 兼容旧名：历史组件仍在用 --dur-* / --ease-*，统一映射过来，避免两套事实来源 */
  --dur-micro:var(--mt-dur-hover);
  --dur-fast: var(--mt-dur-hover);
  --dur-base: var(--mt-dur-modal);
  --dur-slow: var(--mt-dur-drawer);
  --mt-ease-out:  var(--ease-out);
  --mt-ease-in:   cubic-bezier(.4,0,1,1);
  --mt-ease-inout:var(--ease-inout);
  --mt-ease-emphasis:cubic-bezier(.05,.7,.1,1);

  /* ---------- 维度二：Intensity 幅度（只影响动多少） ---------- */
  --mt-intensity:1;    /* 默认 1；Skin 改它即可整体换风格 */
  --mt-drift:1;        /* 位移总开关 */
  --mt-scale-on:1;     /* 缩放总开关 */
  --mt-blur:0;         /* 毛玻璃伴随，默认关 */

  /* 距离基元（基线取自 UI-01 规格） */
  --mt-dist-hover:  calc(1px  * var(--mt-intensity) * var(--mt-drift));
  --mt-dist-page:   calc(4px  * var(--mt-intensity) * var(--mt-drift));
  --mt-dist-float:  calc(2px  * var(--mt-intensity) * var(--mt-drift));
  --mt-dist-toast:  calc(6px  * var(--mt-intensity) * var(--mt-drift));
  --mt-dist-modal:  calc(4px  * var(--mt-intensity) * var(--mt-drift));
  --mt-dist-panel:  calc(24px * var(--mt-intensity) * var(--mt-drift));
  --mt-dist-window: calc(8px  * var(--mt-intensity) * var(--mt-drift));
  --mt-dist-item:   calc(8px  * var(--mt-intensity) * var(--mt-drift));

  /* 缩放基元 */
  --mt-scale-press:  calc(1 - .015 * var(--mt-intensity) * var(--mt-scale-on)); /* .985 */
  --mt-scale-float:  calc(1 - .020 * var(--mt-intensity) * var(--mt-scale-on)); /* .98  */
  --mt-scale-window: calc(1 - .010 * var(--mt-intensity) * var(--mt-scale-on)); /* .99  */

  /* 透明度基元 */
  --mt-fade-from:   clamp(0, calc(1 - .95 * var(--mt-intensity)), 1);
  --mt-fade-window: clamp(0, calc(1 - .30 * var(--mt-intensity)), 1); /* .7 */
  --mt-fade-dim:    clamp(0, calc(1 - .60 * var(--mt-intensity)), 1);
}
/* ---------- 降级：三档，走变量覆盖而不是 !important 归零 ----------
   Reduced：去掉大位移/明显缩放/装饰循环，保留 Focus / State / Progress / Success / Error
   Off    ：关闭非必要动画，但**不关闭交互状态本身**（hover/press/焦点还在） */
[data-motion="reduced"]{
  --mt-intensity:.35; --mt-drift:0; --mt-scale-on:0; --mt-stagger:0ms;
  --mt-dur-press:40ms;  --mt-dur-hover:80ms;  --mt-dur-drag:60ms;  --mt-dur-reorder:80ms;
  --mt-dur-drop:80ms;   --mt-dur-highlight:240ms;
  --mt-dur-scene-out:40ms; --mt-dur-scene-in:80ms; --mt-dur-window:100ms;
  --mt-dur-toast-in:100ms; --mt-dur-toast-out:80ms; --mt-dur-ctx:60ms;
  --mt-dur-drawer:120ms; --mt-dur-modal-bg:80ms; --mt-dur-modal:100ms;
  --mt-dur-ai:140ms; --mt-dur-ai-out:120ms; --mt-dur-perm:80ms;
  --mt-dur-nav:140ms; --mt-dur-nav-out:120ms;
  --mt-dur-entrance:100ms; --mt-dur-entrance-ws:100ms; --mt-dur-entrance-2:80ms;
}
[data-motion="reduced"] .skel,
[data-motion="reduced"] .spinner,
[data-motion="reduced"] .live .dot{ animation:none !important }
[data-motion="off"]{
  --mt-intensity:0; --mt-drift:0; --mt-scale-on:0; --mt-stagger:0ms;
  --mt-dur-press:0ms;  --mt-dur-hover:0ms;  --mt-dur-drag:0ms;  --mt-dur-reorder:0ms;
  --mt-dur-drop:0ms;   --mt-dur-highlight:0ms;
  --mt-dur-scene-out:0ms; --mt-dur-scene-in:0ms; --mt-dur-window:0ms;
  --mt-dur-toast-in:0ms; --mt-dur-toast-out:0ms; --mt-dur-ctx:0ms;
  --mt-dur-drawer:0ms; --mt-dur-modal-bg:0ms; --mt-dur-modal:0ms;
  --mt-dur-ai:0ms; --mt-dur-ai-out:0ms; --mt-dur-perm:0ms;
  --mt-dur-nav:0ms; --mt-dur-nav-out:0ms;
  --mt-dur-entrance:0ms; --mt-dur-entrance-ws:0ms; --mt-dur-entrance-2:0ms;
}
[data-motion="off"] .skel,
[data-motion="off"] .spinner,
[data-motion="off"] .live .dot{ animation:none !important }
/* 系统级偏好：默认跟随；只有用户在本应用内显式选了 Standard 才覆盖系统 */
@media (prefers-reduced-motion:reduce){
  :root:not([data-motion="standard"]){
    --mt-intensity:.35; --mt-drift:0; --mt-scale-on:0; --mt-stagger:0ms;
    --mt-dur-scene-out:40ms; --mt-dur-scene-in:80ms; --mt-dur-window:100ms;
    --mt-dur-drawer:120ms; --mt-dur-modal:100ms; --mt-dur-ai:140ms;
    --mt-dur-entrance:100ms; --mt-dur-entrance-ws:100ms; --mt-dur-entrance-2:80ms;
  }
  :root:not([data-motion="standard"]) .skel,
  :root:not([data-motion="standard"]) .spinner,
  :root:not([data-motion="standard"]) .live .dot{ animation:none !important }
}

/* ==========================================================================
   2. RESET & BASE
   ========================================================================= */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--font-ui); font-size:var(--fs-body); line-height:var(--lh-body);
  color:var(--text-1); background:var(--bg-app);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
ul{margin:0;padding:0;list-style:none}
h1,h2,h3,h4,p{margin:0}
a{color:inherit;text-decoration:none}
svg{display:block}
:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px;border-radius:var(--r-xs)}
::selection{background:var(--brand-100);color:var(--brand-700)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.mono{font-family:var(--font-mono)}

/* ==========================================================================
   3. TYPOGRAPHY SCALE
   ========================================================================= */
.t-display{font-family:var(--font-display);font-size:var(--fs-display);line-height:var(--lh-display);letter-spacing:var(--ls-display);font-weight:600}
.t-page{font-family:var(--font-display);font-size:var(--fs-page);line-height:var(--lh-page);letter-spacing:var(--ls-page);font-weight:600}
.t-section{font-size:var(--fs-section);line-height:var(--lh-section);letter-spacing:var(--ls-section);font-weight:600}
.t-card{font-size:var(--fs-card);line-height:var(--lh-card);letter-spacing:var(--ls-card);font-weight:600}
.t-body{font-size:var(--fs-body);line-height:var(--lh-body)}
.t-sm{font-size:var(--fs-body-sm);line-height:var(--lh-body-sm)}
.t-cap{font-size:var(--fs-caption);line-height:var(--lh-caption);color:var(--text-3)}
.t-label{font-size:var(--fs-label);line-height:var(--lh-label);letter-spacing:var(--ls-label);font-weight:600;color:var(--text-4);text-transform:uppercase}
.t-num{font-family:var(--font-display);font-size:var(--fs-num-lg);line-height:var(--lh-num-lg);font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.c1{color:var(--text-1)} .c2{color:var(--text-2)} .c3{color:var(--text-3)}
.mono-num{font-variant-numeric:tabular-nums}

/* ==========================================================================
   4. APP SHELL —— 「窗口即纸面」
   外层窗口底 → 内缩工作台面板 → 面板内左侧栏 + 内容区
   ========================================================================= */
.shell{
  height:100vh; display:flex; flex-direction:column;
  background:var(--bg-app); padding:0 0 var(--panel-inset);
}
.titlebar{
  height:var(--titlebar-h); flex:0 0 auto; display:flex; align-items:center; gap:var(--space-3);
  padding:0 var(--space-2) 0 var(--space-4); color:var(--text-2);
  -webkit-app-region:drag; user-select:none;
}
.tb-mark{display:flex;align-items:center;gap:var(--space-2);-webkit-app-region:no-drag}
.tb-logo{width:18px;height:18px}
.tb-title{font-size:var(--fs-body-sm);font-weight:600;color:var(--text-2);letter-spacing:-.004em}
.tb-sep{width:1px;height:16px;background:var(--border)}
.tb-context{font-size:var(--fs-body-sm);color:var(--text-3);display:flex;align-items:center;gap:var(--space-2)}
.tb-spacer{flex:1}
.win-btns{display:flex;-webkit-app-region:no-drag}
.win-btns button{
  width:40px;height:32px;display:grid;place-items:center;color:var(--text-3);
  transition:background var(--dur-micro) var(--ease-out),color var(--dur-micro) var(--ease-out);
}
.win-btns button:hover{background:var(--bg-app-hover);color:var(--text-1)}
.win-btns button.danger:hover{background:var(--danger);color:#fff}

/* 工作台面板 */
.panel{
  flex:1; min-height:0; margin:0 var(--panel-inset);
  display:flex; background:var(--bg-canvas);
  border:1px solid var(--border); border-radius:var(--r-2xl);
  box-shadow:var(--shadow-sm); overflow:hidden;
}
/* 侧边栏 */
.sidebar{
  position:relative;                       /* 给边界拖拽手柄做定位父级 */
  flex:0 0 var(--sidebar-w); width:var(--sidebar-w);
  background:var(--surface-2); border-right:1px solid var(--border-subtle);
  display:flex; flex-direction:column; padding:var(--space-3) var(--space-2);
  transition:flex-basis var(--mt-dur-nav) var(--mt-ease-out),width var(--mt-dur-nav) var(--mt-ease-out);
  overflow:hidden;
}
.shell.mini .sidebar{
  flex-basis:var(--sidebar-w-mini);width:var(--sidebar-w-mini);
  padding-left:var(--space-2);padding-right:var(--space-2);
  transition:flex-basis var(--mt-dur-nav-out) var(--mt-ease-out),width var(--mt-dur-nav-out) var(--mt-ease-out)
}
.shell.hide-sidebar .sidebar{flex-basis:0;width:0;padding:0;border:0;opacity:0;pointer-events:none}
.nav-group{padding:var(--space-2) 0}
.nav-group + .nav-group{margin-top:var(--space-1)}
.nav-group-title{padding:0 var(--space-3) var(--space-1);white-space:nowrap}
.nav-item{
  width:100%; height:34px; display:flex; align-items:center; gap:var(--space-3);
  padding:0 var(--space-3); border-radius:var(--r-md); color:var(--text-2);
  font-size:var(--fs-body-sm); font-weight:500; white-space:nowrap;
  transition:background var(--dur-micro) var(--ease-out),color var(--dur-micro) var(--ease-out);
}
.nav-item .ico{flex:0 0 18px;opacity:.9}
.nav-item .lbl{
  overflow:hidden;text-overflow:ellipsis;max-width:180px;opacity:1;
  /* 展开：宽度先走，内容延后 120ms 淡入 —— 与 AI 侧栏同一条节奏 */
  transition:opacity var(--mt-dur-nav-out) var(--mt-ease-out) 120ms, max-width var(--mt-dur-nav) var(--mt-ease-out)
}
.nav-item:hover{background:var(--surface-3);color:var(--text-1)}
.nav-item.active{background:var(--surface-1);color:var(--text-1);font-weight:600;box-shadow:var(--shadow-xs)}
.nav-item.active .ico{color:var(--brand-600)}
.nav-item.active::before{
  content:"";position:absolute;left:0;width:3px;height:16px;border-radius:0 3px 3px 0;background:var(--brand-500)
}
.nav-item{position:relative}
/* 折叠态：内容先淡（立即），宽度后收 —— 收起与展开用不同的 delay，避免文字挤压 */
.shell.mini .nav-item{justify-content:center;padding:0;gap:0}
.shell.mini .nav-item .lbl{
  max-width:0;opacity:0;
  transition:opacity var(--mt-dur-nav-out) var(--mt-ease-in) 0ms, max-width var(--mt-dur-nav-out) var(--mt-ease-out) 0ms
}
.shell.mini .nav-group-title{
  max-width:0;height:0;opacity:0;margin:0;padding-left:0;padding-right:0;overflow:hidden;
  transition:height var(--mt-dur-nav-out) var(--mt-ease-out),opacity var(--mt-dur-nav-out) var(--mt-ease-in)
}
.shell.mini .device-line{justify-content:center;padding:var(--space-2) 0}
.shell.mini .device-line .txt{max-width:0;opacity:0;overflow:hidden;margin-left:0}
.device-line .txt{
  white-space:nowrap;overflow:hidden;max-width:180px;
  transition:opacity var(--mt-dur-nav-out) var(--mt-ease-out) 120ms, max-width var(--mt-dur-nav) var(--mt-ease-out)
}

/* 内容区 */
.content{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.view::-webkit-scrollbar{width:10px}
.view::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;border:3px solid transparent;background-clip:content-box}
.view::-webkit-scrollbar-thumb:hover{background:var(--text-4);background-clip:content-box;border:3px solid transparent}
.view::-webkit-scrollbar-track{background:transparent}
.page{padding:var(--pad-page-t) var(--pad-page-x) var(--space-12);max-width:var(--content-max)}
.page.wide{max-width:1400px}
.page-head{display:flex;align-items:flex-end;gap:var(--space-4);margin-bottom:var(--space-6)}
.page-head .grow{flex:1;min-width:0}
.sec{margin-top:var(--gap-section)}
.sec-head{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4)}
.sec-head .grow{flex:1}
.stack{display:flex;flex-direction:column;gap:var(--gap-stack)}
.row{display:flex;align-items:center;gap:var(--gap-inline)}
.grid{display:grid;gap:var(--gap-card)}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.spacer{flex:1}
hr.sep{border:0;border-top:1px solid var(--border-subtle);margin:0}
.view-enter{animation:viewIn var(--dur-base) var(--ease-out)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ==========================================================================
   5. PRIMITIVES
   ========================================================================= */
/* --- Button -------------------------------------------------------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);
  height:34px;padding:0 var(--space-4);border-radius:var(--r-md);
  font-size:var(--fs-body-sm);font-weight:600;letter-spacing:-.003em;white-space:nowrap;
  background:var(--surface-3);color:var(--text-1);
  transition:background var(--dur-micro) var(--ease-out),color var(--dur-micro) var(--ease-out),
             box-shadow var(--dur-micro) var(--ease-out),transform var(--dur-micro) var(--ease-out);
}
.btn:hover{background:var(--border)}
.btn:active{transform:scale(.985)}
.btn[disabled],.btn.is-disabled{opacity:.45;pointer-events:none}
.btn--sm{height:28px;padding:0 var(--space-3);font-size:var(--fs-caption)}
.btn--lg{height:40px;padding:0 var(--space-5);font-size:var(--fs-card)}
.btn--primary{background:var(--brand-500);color:var(--text-on-brand)}
.btn--primary:hover{background:var(--brand-600)}
.btn--primary:active{background:var(--brand-700)}
.btn--secondary{background:var(--surface-1);color:var(--text-1);box-shadow:var(--shadow-xs);border:1px solid var(--border)}
.btn--secondary:hover{background:var(--surface-hover);border-color:var(--border-strong)}
.btn--ghost{background:transparent;color:var(--text-2)}
.btn--ghost:hover{background:var(--surface-3);color:var(--text-1)}
.btn--brand-ghost{background:var(--brand-50);color:var(--brand-700)}
.btn--brand-ghost:hover{background:var(--brand-100)}
.btn--danger{background:var(--danger-soft);color:var(--danger-text)}
.btn--danger:hover{background:#F6DED9}
.btn--icon-only{width:34px;padding:0}
/* --- IconButton ---------------------------------------------------------- */
.icon-btn{
  width:30px;height:30px;display:grid;place-items:center;border-radius:var(--r-sm);
  color:var(--text-3);transition:background var(--dur-micro) var(--ease-out),color var(--dur-micro) var(--ease-out);
}
.icon-btn:hover{background:var(--surface-3);color:var(--text-1)}
.icon-btn.lg{width:38px;height:38px;border-radius:var(--r-md)}
.icon-btn.sm{width:26px;height:26px}
.icon-btn.on{background:var(--brand-50);color:var(--brand-700)}
/* --- Input / Search / Select --------------------------------------------- */
.input{
  display:flex;align-items:center;gap:var(--space-2);height:34px;padding:0 var(--space-3);
  background:var(--surface-3);border:1px solid transparent;border-radius:var(--r-md);
  color:var(--text-1);transition:background var(--dur-micro) var(--ease-out),border-color var(--dur-micro) var(--ease-out),box-shadow var(--dur-micro) var(--ease-out);
}
.input:hover{background:var(--surface-inset)}
.input:focus-within{background:var(--surface-1);border-color:var(--brand-400);box-shadow:0 0 0 3px var(--brand-50)}
.input input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:var(--fs-body-sm)}
.input input::placeholder{color:var(--text-4)}
/* UI-08：档案编辑 —— 签名多行输入与头像选择格（复用 input / badge-emoji，无新 token 动画） */
.input textarea{flex:1;min-width:0;border:0;background:none;outline:0;font-size:var(--fs-body-sm);resize:none;line-height:1.5;padding:2px 0}
.input textarea::placeholder{color:var(--text-4)}
.avatar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:var(--space-2)}
.avatar-pick{
  display:grid;place-items:center;height:64px;border-radius:var(--r-lg);font-size:24px;
  border:1px solid var(--border);background:var(--surface-1);cursor:pointer;
  transition:border-color var(--dur-micro) var(--ease-out),background var(--dur-micro) var(--ease-out)
}
.avatar-pick:hover{background:var(--surface-2)}
.avatar-pick.on{border-color:var(--brand-400);background:var(--brand-50)}
.avatar-pick--up{border-style:dashed;color:var(--text-3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:var(--fs-caption)}
.input.lg{height:40px;padding:0 var(--space-4)}
.input.lg input{font-size:var(--fs-card)}
.search{width:300px;max-width:100%}
.search.wide{width:100%}
.select{
  display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);
  height:34px;padding:0 var(--space-2) 0 var(--space-3);min-width:180px;
  background:var(--surface-3);border-radius:var(--r-md);font-size:var(--fs-body-sm);color:var(--text-1);
}
.select:hover{background:var(--surface-inset)}
.field{display:flex;flex-direction:column;gap:var(--space-2)}
.field > .t-cap{color:var(--text-3)}
/* --- Card / Tile / Surface ------------------------------------------------ */
.card{
  background:var(--surface-1);border:1px solid var(--border-subtle);border-radius:var(--r-xl);
  padding:var(--pad-card);
  transition:box-shadow var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out);
}
.card--flat{box-shadow:none}
.card--hoverable:hover{box-shadow:var(--shadow-md);border-color:var(--border);transform:translateY(-1px)}
.card--lg{padding:var(--pad-card-lg);border-radius:var(--r-xl)}
.card--ghost{background:var(--surface-2);border-color:transparent}
.card--dashed{background:transparent;border:1px dashed var(--border-strong)}
.tile{
  background:var(--surface-1);border:1px solid var(--border-subtle);border-radius:var(--r-lg);
  padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-2);
  transition:background var(--dur-fast) var(--ease-out),box-shadow var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out);
}
.tile:hover{box-shadow:var(--shadow-sm);border-color:var(--border)}
/* --- Badge / Chip / Tag --------------------------------------------------- */
.badge{
  display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 var(--space-2);
  border-radius:var(--r-xs);font-size:var(--fs-caption);font-weight:600;
  background:var(--surface-3);color:var(--text-2);
}
.badge--success{background:var(--success-soft);color:var(--success-text)}
.badge--warning{background:var(--warning-soft);color:var(--warning-text)}
.badge--danger{background:var(--danger-soft);color:var(--danger-text)}
.badge--brand{background:var(--brand-50);color:var(--brand-700)}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 var(--space-3);
  border-radius:var(--r-full);background:var(--surface-3);color:var(--text-2);font-size:var(--fs-caption);
}
.chip--outline{background:transparent;border:1px solid var(--border);color:var(--text-2)}
.chip--brand{background:var(--brand-50);color:var(--brand-700)}
.chip--removable{padding-right:var(--space-1)}
.chip button{display:grid;place-items:center;width:20px;height:20px;border-radius:var(--r-full);color:var(--text-3)}
.chip button:hover{background:var(--border);color:var(--text-1)}
/* --- Avatar --------------------------------------------------------------- */
.avatar{
  width:32px;height:32px;border-radius:var(--r-full);display:grid;place-items:center;
  background:var(--brand-100);color:var(--brand-700);font-weight:600;font-size:var(--fs-body-sm);flex:0 0 auto;
}
.avatar.lg{width:56px;height:56px;font-size:18px}
.avatar.sm{width:24px;height:24px;font-size:11px}
/* --- Segmented / Tabs / Switch -------------------------------------------- */
.seg{display:inline-flex;padding:2px;background:var(--surface-3);border-radius:var(--r-md);gap:2px}
.seg button{
  height:28px;padding:0 var(--space-3);border-radius:6px;font-size:var(--fs-caption);font-weight:600;
  color:var(--text-3);display:inline-flex;align-items:center;gap:6px;
  transition:background var(--dur-micro) var(--ease-out),color var(--dur-micro) var(--ease-out),box-shadow var(--dur-micro) var(--ease-out);
}
.seg button:hover{color:var(--text-1)}
.seg button.on{background:var(--surface-1);color:var(--text-1);box-shadow:var(--shadow-xs)}
.tabs{display:flex;gap:var(--space-5);border-bottom:1px solid var(--border-subtle)}
.tabs button{
  position:relative;padding:0 0 var(--space-3);font-size:var(--fs-card);font-weight:600;color:var(--text-3);
  transition:color var(--dur-micro) var(--ease-out)
}
.tabs button:hover{color:var(--text-1)}
.tabs button.on{color:var(--text-1)}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brand-500);border-radius:2px 2px 0 0}
.switch{
  width:36px;height:20px;border-radius:var(--r-full);background:var(--border-strong);position:relative;flex:0 0 auto;
  transition:background var(--dur-fast) var(--ease-out)
}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:var(--shadow-xs);transition:transform var(--dur-fast) var(--ease-out)
}
.switch.on{background:var(--brand-500)}
.switch.on::after{transform:translateX(16px)}
.checkbox{
  width:18px;height:18px;border-radius:var(--r-sm);border:1.5px solid var(--border-strong);
  display:grid;place-items:center;flex:0 0 auto;color:transparent;
  transition:background var(--dur-micro) var(--ease-out),border-color var(--dur-micro) var(--ease-out),color var(--dur-micro) var(--ease-out)
}
.checkbox.on{background:var(--brand-500);border-color:var(--brand-500);color:#fff}
.radio{
  width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border-strong);display:grid;place-items:center;flex:0 0 auto;
  transition:border-color var(--dur-micro) var(--ease-out)
}
.radio::after{content:"";width:8px;height:8px;border-radius:50%;background:transparent;transition:background var(--dur-micro) var(--ease-out)}
.radio.on{border-color:var(--brand-500)}
.radio.on::after{background:var(--brand-500)}
/* --- List row (设置项 / 通用行) -------------------------------------------- */
.row-item{
  display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);
  border-radius:var(--r-lg);transition:background var(--dur-micro) var(--ease-out)
}
.row-item + .row-item{margin-top:2px}
.row-item:hover{background:var(--surface-2)}
.row-item .main{flex:1;min-width:0}
.row-item .title{font-size:var(--fs-card);font-weight:500}
/* --- Tooltip -------------------------------------------------------------- */
.tip{position:relative}
.tip > .tip-body{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);
  background:var(--text-1);color:var(--bg-canvas);font-size:var(--fs-caption);line-height:18px;
  padding:6px 10px;border-radius:var(--r-sm);white-space:nowrap;opacity:0;pointer-events:none;z-index:var(--z-tip);
  transition:opacity var(--dur-micro) var(--ease-out),transform var(--dur-micro) var(--ease-out);box-shadow:var(--shadow-md)
}
.tip:hover > .tip-body{opacity:1;transform:translateX(-50%)}
/* --- Toast ---------------------------------------------------------------- */
.toast-host{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column;gap:var(--space-2);z-index:var(--z-toast)}
.toast{
  display:flex;align-items:center;gap:var(--space-3);padding:10px var(--space-4);
  background:var(--surface-overlay);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg);font-size:var(--fs-body-sm);color:var(--text-1);
  animation:toastIn var(--dur-base) var(--ease-out)
}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
/* --- Modal & Drawer -------------------------------------------------------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:var(--z-modal);animation:fadeIn var(--dur-fast) var(--ease-out)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:var(--z-modal);
  width:min(560px,calc(100vw - 64px));max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface-overlay);border:1px solid var(--border);border-radius:var(--r-2xl);
  box-shadow:var(--shadow-lg);animation:modalIn var(--dur-base) var(--ease-out)
}
@keyframes modalIn{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.modal-head{padding:var(--space-5) var(--space-6) var(--space-4)}
.modal-body{padding:0 var(--space-6)}
.modal-foot{padding:var(--space-5) var(--space-6);display:flex;justify-content:flex-end;gap:var(--space-2)}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;z-index:var(--z-drawer);
  background:var(--surface-overlay);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;animation:drawerIn var(--dur-base) var(--ease-out)
}
@keyframes drawerIn{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.drawer-head{padding:var(--space-4) var(--space-5);display:flex;align-items:center;gap:var(--space-3);border-bottom:1px solid var(--border-subtle)}
.drawer-body{flex:1;overflow-y:auto;padding:var(--space-5)}
.drawer-foot{padding:var(--space-4) var(--space-5);border-top:1px solid var(--border-subtle);display:flex;gap:var(--space-2)}
/* --- Progress ------------------------------------------------------------- */
.progress{height:6px;border-radius:99px;background:var(--bg-sunken);overflow:hidden}
.progress > i{display:block;height:100%;border-radius:99px;background:var(--brand-500)}
.progress.thin{height:4px}
.progress > i.ok{background:var(--success)}
/* --- Skeleton / Loading --------------------------------------------------- */
.skel{border-radius:var(--r-sm);background:linear-gradient(90deg,var(--surface-3) 25%,var(--surface-2) 37%,var(--surface-3) 63%);background-size:400% 100%;animation:skel 1.4s ease-in-out infinite}
@keyframes skel{0%{background-position:100% 50%}100%{background-position:0 50%}}
.spinner{width:16px;height:16px;border-radius:50%;border:1.6px solid var(--border-strong);border-top-color:var(--brand-500);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* --- Empty / Error -------------------------------------------------------- */
.empty{
  text-align:center;padding:var(--space-12) var(--space-8);
  border:1px dashed var(--border-strong);border-radius:var(--r-xl);background:var(--surface-2)
}
.empty .illus{width:56px;height:56px;margin:0 auto var(--space-4);border-radius:var(--r-xl);display:grid;place-items:center;background:var(--surface-3);color:var(--text-3)}
.empty .t-cap{max-width:340px;margin:var(--space-2) auto 0}
.error{border:1px solid var(--danger-soft);background:var(--surface-1);border-radius:var(--r-xl);padding:var(--pad-card)}
.error .ill{width:36px;height:36px;border-radius:var(--r-lg);display:grid;place-items:center;background:var(--danger-soft);color:var(--danger-text)}

/* ==========================================================================
   6. APP ICON & MINI MAP（产品的视觉签名）
   ========================================================================= */
.app{
  width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--app-tint-1);color:var(--app-ink-1);
}
.app.lg{width:52px;height:52px;border-radius:13px}
.app.xl{width:64px;height:64px;border-radius:16px}
.app.sm{width:32px;height:32px;border-radius:8px}
.app.xs{width:24px;height:24px;border-radius:7px}
.app.tint1{background:var(--app-tint-1);color:var(--app-ink-1)}
.app.tint2{background:var(--app-tint-2);color:var(--app-ink-2)}
.app.tint3{background:var(--app-tint-3);color:var(--app-ink-3)}

}

.minimap i.t1{background:var(--app-tint-1)} .minimap i.t2{background:var(--app-tint-2)}
.minimap i.t3{background:var(--app-tint-3)} .minimap i.t4{background:var(--app-tint-4)}
.minimap i.t5{background:var(--app-tint-5)} .minimap i.t6{background:var(--app-tint-6)}
/* 软件方块（首页 / 软件页） */
.app-square{
  display:flex;flex-direction:column;align-items:center;gap:var(--space-2);
  padding:var(--space-3);border-radius:var(--r-lg);transition:background var(--dur-fast) var(--ease-out)
}

.app-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2);border-radius:var(--r-md);transition:background var(--dur-micro) var(--ease-out)}
.app-row:hover{background:var(--surface-2)}
.app-row .nm{flex:1;min-width:0;font-size:var(--fs-body-sm);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-pick{
  position:relative;display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);
  border-radius:var(--r-lg);border:1.5px solid transparent;transition:background var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out)}
.app-pick:hover{background:var(--surface-2)}

.app-pick.on .tick{opacity:1;transform:none}

/* ==========================================================================
   7. 首页 / 工作空间卡片
   ========================================================================= */
/* 首页音乐条：放在问候语右侧，默认无背景，hover 才浮出，克制到不抢标题 */
.greet{display:flex;align-items:center;gap:var(--space-4);margin-bottom:var(--space-6)}

  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.nowplaying .art{font-size:var(--fs-caption);color:var(--text-3);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowplaying .bar{width:64px;flex:0 0 auto}

@media (max-width:1040px){ .nowplaying{display:none} }
/* 首页 Hero */
.hero{
  position:relative;overflow:hidden;
  background:var(--surface-1);border:1px solid var(--border-subtle);border-radius:var(--r-2xl);
  padding:var(--pad-card-lg);display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:var(--space-6);
  box-shadow:var(--shadow-sm);
}
.hero::after{
  content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(closest-side,var(--brand-50),transparent);opacity:.9;pointer-events:none
}
.hero .grow{position:relative;z-index:1}
.hero .map{position:relative;z-index:1;height:132px;align-self:center}
.hero .apps{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.hero .badge-emoji{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:19px;
  background:var(--surface-3);border:1px solid var(--border-subtle)
}
.ws-card{
  position:relative;background:var(--surface-1);border:1px solid var(--border-subtle);border-radius:var(--r-xl);
  padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);cursor:pointer;
  transition:box-shadow var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)
}
.ws-card:hover{box-shadow:var(--shadow-md);border-color:var(--border);transform:translateY(-2px)}
.ws-card .hd{display:flex;align-items:center;gap:var(--space-2)}
.ws-card .nm{font-size:var(--fs-card);font-weight:600;letter-spacing:-.003em}
.ws-card .map{height:56px;width:100%}
.ws-card.size-l .map{height:92px}
.ws-card.size-s{grid-column:span 3}
.ws-card.size-m{grid-column:span 3}
.ws-card.size-l{grid-column:span 6}
.ws-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gap-card)}
.ws-card .actions{display:flex;gap:var(--space-2);opacity:0;transform:translateY(4px);transition:opacity var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}
.ws-card:hover .actions,.ws-card:focus-within .actions{opacity:1;transform:none}
.new-card{
  border:1px dashed var(--border-strong);border-radius:var(--r-xl);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:var(--space-2);color:var(--text-3);min-height:150px;
  transition:background var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out)
}
.new-card:hover{background:var(--surface-2);border-color:var(--brand-300);color:var(--brand-700)}
.stat{padding:var(--space-4);border-radius:var(--r-lg);background:var(--surface-2)}
.stat .v{font-family:var(--font-display);font-size:20px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:2px;height:34px}
.spark i{flex:1;border-radius:2px 2px 0 0;background:var(--brand-200);min-height:3px}
.spark i.hi{background:var(--brand-500)}

/* ==========================================================================
   8. 工作空间运行界面（沉浸态）
   ========================================================================= */
.shell.cinema .panel{border-radius:var(--r-2xl);overflow:hidden}
.run-head{
  height:var(--topbar-h);flex:0 0 auto;display:flex;align-items:center;gap:var(--space-3);
  padding:0 var(--space-4);border-bottom:1px solid var(--border-subtle);background:var(--surface-1)
}
.run-head .nm{font-size:var(--fs-card);font-weight:600}
.live{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-caption);color:var(--success-text);background:var(--success-soft);height:22px;padding:0 var(--space-2);border-radius:var(--r-xs);font-weight:600}
.live .dot{width:6px;height:6px;border-radius:50%;background:var(--success);animation:pulse 2.4s var(--ease-inout) infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}
.appbar{
  height:var(--appbar-h);flex:0 0 auto;display:flex;align-items:center;gap:var(--space-1);
  padding:0 var(--space-3);background:var(--surface-1);border-bottom:1px solid var(--border-subtle)
}
.apptab{
  display:flex;align-items:center;gap:var(--space-2);height:32px;padding:0 var(--space-3);
  border-radius:var(--r-md);color:var(--text-2);font-size:var(--fs-body-sm);font-weight:500;position:relative;
  transition:background var(--dur-micro) var(--ease-out),color var(--dur-micro) var(--ease-out)
}
.apptab:hover{background:var(--surface-3);color:var(--text-1)}
.apptab.on{background:var(--brand-50);color:var(--brand-700);font-weight:600}
.stage{
  flex:1;min-height:0;display:flex;background:var(--bg-sunken);position:relative;
  background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:22px 22px;
}
.stage-grid{flex:1;min-width:0;position:relative;padding:12px}
.win{
  position:absolute;border-radius:var(--r-lg);background:var(--surface-1);overflow:hidden;
  border:1px solid var(--border);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;
  transition:box-shadow var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out),opacity var(--dur-fast) var(--ease-out)
}
.win.sel{border-color:var(--brand-400);box-shadow:var(--shadow-lg),0 0 0 3px var(--brand-50)}
/* UI-03 拖动过程反馈：只复用 shadow/brand/dur-fast 既有 token，无新动画（左/top 仍无过渡，保持 1:1 跟手） */
.win.carried{box-shadow:var(--shadow-lg);border-color:var(--brand-300);z-index:6}
.stage.carrying .win:not(.carried){opacity:.72}
.stage-hint{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);pointer-events:none;
  display:flex;align-items:center;gap:6px;height:26px;padding:0 var(--space-3);
  background:var(--surface-1);border:1px solid var(--border);border-radius:99px;
  color:var(--text-3);font-size:var(--fs-caption);box-shadow:var(--shadow-xs);white-space:nowrap
}
/* ==========================================================================
   UI-05-B：工作模式状态系统 —— 状态栏（run-head 第二行）/ 模板卡 / 准备反馈。
   复用 chip/card/drawer/spinner 与既有 token；零新 token、零新动画体系。
   ========================================================================= */
.run-status{
  flex:0 0 auto;display:flex;align-items:center;gap:var(--space-4);flex-wrap:wrap;row-gap:4px;
  min-height:36px;padding:5px var(--space-4);border-bottom:1px solid var(--border-subtle);background:var(--surface-1)
}
.rs-item{display:inline-flex;align-items:center;gap:var(--space-2);min-width:0}
.rs-k{font-size:var(--fs-caption);color:var(--text-3);font-weight:600;flex:0 0 auto}
.rs-apps{flex:1 1 auto;flex-wrap:wrap}
.rs-app{height:24px;gap:6px}
.rs-app .rs-st{font-size:var(--fs-caption);color:var(--text-4)}
.rs-dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.rs-dot.ok{background:var(--success)}
.rs-dot.wait{background:var(--warning)}
.rs-dot.off{background:var(--text-4)}
/* 工作模式模板卡（工作空间页） */
.wf-row{display:flex;gap:var(--space-3);flex-wrap:wrap;margin:var(--space-3) 0 var(--space-5)}
.wf-mode{
  display:flex;align-items:center;gap:var(--space-3);min-width:230px;text-align:left;
  padding:var(--space-3) var(--space-4);border:1px solid var(--border);border-radius:var(--r-lg);
  background:var(--surface-1);
  transition:background var(--dur-micro) var(--ease-out),border-color var(--dur-micro) var(--ease-out)
}
.wf-mode:hover{background:var(--surface-2)}
.wf-mode--new{border-style:dashed;color:var(--text-3);justify-content:center;min-width:150px}
/* 准备工作空间反馈（纯视觉 mock）：复用 .scrim/.modal/.spinner 与既有 keyframes */
.run-prep{display:flex;flex-direction:column;align-items:center;gap:var(--space-3);padding:var(--space-6) var(--space-7);width:auto;max-width:none}
.rp-steps{display:flex;flex-direction:column;gap:6px;min-width:150px;margin-top:var(--space-1)}
.rp-step{display:flex;align-items:center;gap:8px;color:var(--text-3);font-size:var(--fs-body-sm);opacity:.5}
.rp-step.done{color:var(--text-1);opacity:1}
/* ==========================================================================
   UI-06：模型管理中心 —— 复用 card/chip/drawer/toast 与既有 token；零新 token 零新动画
   ========================================================================= */
.model-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:var(--space-3)}
.model-card{display:flex;flex-direction:column;gap:var(--space-2);text-align:left}
.model-card .mc-foot{display:flex;gap:var(--space-1);flex-wrap:wrap;margin-top:var(--space-1)}
.model-card .mc-foot .btn{flex:0 0 auto}
.win-bar{
  height:32px;flex:0 0 auto;display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2) 0 var(--space-3);
  background:var(--surface-2);border-bottom:1px solid var(--border-subtle);cursor:grab;user-select:none
}
.win.sel .win-bar{background:var(--brand-50)}
.win-bar .nm{font-size:var(--fs-caption);font-weight:600;color:var(--text-2)}
.win-bar .grip{margin-left:0;display:flex;gap:2px;color:var(--text-4)}
.win-body{flex:1;min-height:0;padding:var(--space-3);overflow:hidden}
.win-handle{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;color:var(--text-4);display:grid;place-items:center;opacity:0;transition:opacity var(--dur-micro)}
.win:hover .win-handle{opacity:1}
/* UI-04-A4：窗口缩放热区 —— 不可见，只做光标暗示（极简桌面软件感）；右下角保留既有 grip 视觉 */
.rz{position:absolute;z-index:2}
.rz-n{top:0;left:10px;right:10px;height:6px;cursor:ns-resize}
.rz-s{bottom:0;left:10px;right:10px;height:6px;cursor:ns-resize}
.rz-e{right:0;top:10px;bottom:10px;width:6px;cursor:ew-resize}
.rz-w{left:0;top:10px;bottom:10px;width:6px;cursor:ew-resize}
.rz-ne{top:0;right:0;width:14px;height:14px;cursor:nesw-resize}
.rz-nw{top:0;left:0;width:14px;height:14px;cursor:nwse-resize}
.rz-se{bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize}
.rz-sw{bottom:0;left:0;width:14px;height:14px;cursor:nesw-resize}
/* resize 过程中的尺寸提示：只在 resizing 时存在，松手淡出（不持续显示） */
.win-size{
  position:absolute;top:38px;right:10px;z-index:3;pointer-events:none;
  background:var(--surface-overlay);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:2px 8px;font-family:var(--font-mono);font-size:var(--fs-caption);color:var(--text-2);
  box-shadow:var(--shadow-sm)
}
.win-size.out{opacity:0;transition:opacity var(--dur-micro) var(--ease-out)}
/* UI-04-A2：AI 工作区 —— 左会话列表 + 右聊天主区（视觉中心） */
.ai-grid{display:grid;grid-template-columns:264px 1fr;gap:var(--gap-section);align-items:stretch}
.ai-sessions{display:flex;flex-direction:column;padding:0;overflow:hidden}
.ai-session-list{flex:1;overflow-y:auto;padding:var(--space-2);display:flex;flex-direction:column;gap:2px}
.ai-session{
  display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3);
  border-radius:var(--r-md);color:var(--text-2);border:none;background:none;text-align:left;
  transition:background var(--dur-micro) var(--ease-out),color var(--dur-micro) var(--ease-out)
}
.ai-session:hover{background:var(--surface-3);color:var(--text-1)}
.ai-session.on{background:var(--brand-50);color:var(--brand-700);font-weight:600}
.ai-chat{display:flex;flex-direction:column;min-height:calc(100vh - 300px);padding:0;overflow:hidden}
.ai-chat-head{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--border-subtle)}
.ai-msgs{flex:1;overflow-y:auto;padding:var(--space-5) 0}
/* 窗口内容抽象示意 */
.mock-code{display:flex;gap:var(--space-2);height:100%}
.mock-side{width:64px;border-radius:6px;background:var(--surface-3);padding:6px;display:flex;flex-direction:column;gap:5px}
.mock-side i{height:4px;border-radius:2px;background:var(--border-strong);opacity:.7}
.mock-main{flex:1;display:flex;flex-direction:column;gap:7px;padding-top:2px}
.mock-main i{height:5px;border-radius:2px;background:var(--border-subtle)}
.mock-main i.w40{width:40%} .mock-main i.w70{width:70%} .mock-main i.w55{width:55%} .mock-main i.w85{width:85%} .mock-main i.w30{width:30%}
.mock-main i.ind{margin-left:14px}

.mock-browser{display:flex;flex-direction:column;gap:8px;height:100%}

.mock-block{flex:1;border-radius:6px;background:var(--surface-3);display:flex;flex-direction:column;gap:8px;padding:10px}
.mock-term{font-family:var(--font-mono);font-size:11px;line-height:18px;color:var(--text-2);height:100%}

/* AI 侧边栏 */
/* 全局 AI 侧栏：任何页面都在。默认收起为 48px 竖条，展开 360px（AI 不抢主角） */
.ai-dock{
  position:relative;                       /* 给边界拖拽手柄做定位父级 */
  flex:0 0 var(--ai-panel-w);width:var(--ai-panel-w);background:var(--surface-1);
  border-left:1px solid var(--border-subtle);display:flex;flex-direction:column;overflow:hidden;
  transition:flex-basis var(--mt-dur-nav) var(--mt-ease-out),width var(--mt-dur-nav) var(--mt-ease-out)
}
.ai-dock.collapsed{flex-basis:48px;width:48px}
.ai-dock .dock-panel{display:flex;flex-direction:column;flex:1;min-width:var(--ai-panel-w);min-height:0}
.ai-dock.collapsed .dock-panel{display:none}
.ai-dock .dock-rail{display:none;flex:1;flex-direction:column;align-items:center;gap:var(--space-3);padding:var(--space-3) 0}
.ai-dock.collapsed .dock-rail{display:flex}
.rail-btn{
  width:32px;height:32px;border-radius:var(--r-md);display:grid;place-items:center;
  background:var(--brand-50);color:var(--brand-700);flex:0 0 auto;
  transition:background var(--dur-micro) var(--ease-out),transform var(--dur-micro) var(--ease-out)
}

.rail-label{
  writing-mode:vertical-rl;font-size:var(--fs-caption);font-weight:600;color:var(--text-2);
  letter-spacing:.14em;margin-top:var(--space-2)
}
.rail-mode{
  margin-top:auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface-3);color:var(--text-3);font-size:10px;font-weight:600
}
.rail-mode.on{background:var(--success-soft);color:var(--success-text)}
.ai-head{padding:var(--space-4);border-bottom:1px solid var(--border-subtle)}
.ai-perm{
  display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3);
  background:var(--success-soft);border-radius:var(--r-md);color:var(--success-text);font-size:var(--fs-caption)
}
.ai-perm .dot{width:6px;height:6px;border-radius:50%;background:var(--success);flex:0 0 auto}

.msg{display:flex;gap:var(--space-2);padding:var(--space-3) var(--space-4)}
.msg .bubble{
  max-width:84%;padding:var(--space-2) var(--space-3);border-radius:var(--r-lg);
  font-size:var(--fs-body-sm);line-height:20px;background:var(--surface-2);color:var(--text-1)
}
.msg.me{justify-content:flex-end}
.msg.me .bubble{background:var(--brand-50);color:var(--brand-700);border-bottom-right-radius:var(--r-sm)}
.ai-suggest{display:flex;flex-wrap:wrap;gap:6px;padding:0 var(--space-4) var(--space-3)}
.ai-input{margin-top:auto;padding:var(--space-3) var(--space-4) var(--space-4);border-top:1px solid var(--border-subtle)}
.ai-fab{
  position:absolute;right:12px;bottom:12px;z-index:5;display:flex;align-items:center;gap:var(--space-2);
  height:36px;padding:0 var(--space-3);border-radius:var(--r-full);background:var(--surface-1);

}

/* ==========================================================================
   9. 创建工作空间 / 学习 / 项目 / 生活 / 设备 / 规范页 专用
   ========================================================================= */
.wizard{max-width:720px;margin:0 auto;padding:var(--space-8) var(--pad-page-x) var(--space-12)}
.wsteps{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-8)}
.wstep{display:flex;align-items:center;gap:var(--space-2);font-size:var(--fs-body-sm);color:var(--text-4);font-weight:600}
.wstep .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--surface-3);color:var(--text-3)}
.wstep.on{color:var(--text-1)} .wstep.on .n{background:var(--brand-500);color:#fff}
.wstep.done{color:var(--text-3)} .wstep.done .n{background:var(--brand-100);color:var(--brand-700)}
.wline{width:24px;height:1px;background:var(--border)}
.pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3)}
.pick{
  position:relative;text-align:left;padding:var(--space-4);border-radius:var(--r-lg);

  transition:border-color var(--dur-fast) var(--ease-out),background var(--dur-fast) var(--ease-out),box-shadow var(--dur-fast) var(--ease-out)
}
.pick:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
.pick.on{border-color:var(--brand-500);background:var(--brand-50);box-shadow:0 0 0 3px var(--brand-50)}
.pick .em{font-size:20px;line-height:1}
.pick .t{font-size:var(--fs-card);font-weight:600;margin-top:var(--space-2)}
.pick .d{font-size:var(--fs-caption);color:var(--text-3);margin-top:2px}
.pick .tick{position:absolute;top:10px;right:10px;width:18px;height:18px;border-radius:50%;background:var(--brand-500);color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.8);transition:all var(--dur-micro) var(--ease-out)}
.pick.on .tick{opacity:1;transform:none}
.detect{
  display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);
  background:var(--surface-1);border:1px solid var(--border-subtle);border-radius:var(--r-lg)
}
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1.5px;background:var(--border)}
.tl-item{position:relative;padding:var(--space-2) 0}

.tl-item.done .node{background:var(--brand-500);border-color:var(--brand-500);color:#fff}
.tl-item.cur .node{border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-50)}
.tl-item.cur .node::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--brand-500)}
.life-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap-card)}
.life-card{padding:var(--space-4);border-radius:var(--r-xl);background:var(--surface-1);border:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:var(--space-3)}
.life-card.span2{grid-column:span 2}
.metric{display:flex;flex-direction:column;gap:6px}
.metric .v{font-family:var(--font-display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.metric .k{font-size:var(--fs-caption);color:var(--text-3)}
.spec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:var(--space-3)}
.swatch{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--border-subtle);background:var(--surface-1)}
.swatch .c{height:56px}
.swatch .m{padding:var(--space-2) var(--space-3)}
.swatch .m .n{font-size:var(--fs-caption);font-weight:600}
.swatch .m .h{font-size:11px;color:var(--text-3);font-family:var(--font-mono)}
.demo{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}
.comp-block{padding:var(--space-5);border-radius:var(--r-xl);background:var(--surface-1);border:1px solid var(--border-subtle)}
.comp-name{font-size:var(--fs-card);font-weight:600;margin-bottom:var(--space-4)}

/* ==========================================================================
   10. 响应式（桌面窗口尺寸适配）
   ========================================================================= */
@media (max-width:1240px){
  .page{padding-left:var(--space-6);padding-right:var(--space-6)}
  .hero{grid-template-columns:1fr 160px}
  .life-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:1100px){
  /* UI-04-C-P0：侧栏 chrome 归 10d 状态机管（此处原 nav 收窄/藏文字规则已删，
     否则会与 COMPACT「导航 180 保留文字」打架）；只保留纯内容列降级 */
  .g4{grid-template-columns:repeat(2,1fr)}
  .pick-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:960px){
  :root{--pad-page-t:20px;--ai-panel-w:320px}
  .hero{grid-template-columns:1fr}
  .hero .map{display:none}
  .g3,.g2{grid-template-columns:1fr}
  .search{width:220px}
}
@media (max-width:1300px){
  /* 三栏侧区（导航 236 + 组件 224 + AI 360）在 1300 以下太挤，先收起组件区 */
  .widget-col{flex-basis:0;width:0;padding-left:0;padding-right:0;border-left:0;overflow:hidden}
}
@media (max-width:1180px){
  /* 窄窗口下 AI 侧栏默认收成竖条，除非用户主动展开（force-open） */
  .ai-dock{flex-basis:48px;width:48px}
  .ai-dock .dock-panel{display:none}
  .ai-dock .dock-rail{display:flex}
  .ai-dock.force-open:not(.collapsed){flex-basis:var(--ai-panel-w);width:var(--ai-panel-w)}
  .ai-dock.force-open:not(.collapsed) .dock-panel{display:flex}
  .ai-dock.force-open:not(.collapsed) .dock-rail{display:none}
}
@media (max-width:820px){
  .ws-grid{grid-template-columns:repeat(6,1fr)}
  .ws-card.size-l,.ws-card.size-m,.ws-card.size-s{grid-column:span 3}
  .life-grid{grid-template-columns:1fr}
  .life-card.span2{grid-column:span 1}
  .stage{flex-direction:column}
}
@media (max-width:680px){
  .page{padding-left:var(--space-4);padding-right:var(--space-4)}
  .ws-grid{grid-template-columns:1fr}
  .ws-card.size-l,.ws-card.size-m,.ws-card.size-s{grid-column:span 1}
  .page-head{flex-wrap:wrap}
}
/* ==========================================================================
   10b. UI-04-C：内容排布分档 —— 按【内容区宽度】（.view clientWidth，由 JS 写
   shell[data-cw] = lg(≤1080) / md(≤900) / sm(≤700) / xs(≤580)，带滞回）。
   原则：不删内容、不换信息架构；先收紧，再堆叠（行动中心移到下方，内容保留），
   极限档（xs）兜底单列。chrome（导航/AI/组件区）策略见 10d 状态机。
   ========================================================================= */
.grid-recent,.ws-home{grid-template-columns:repeat(6,1fr)}
.home-split{grid-template-columns:minmax(0,2fr) minmax(272px,1fr);align-items:start;gap:var(--gap-section)}
.home-split > div{min-width:0}   /* 防格子内容把列撑爆（挤压链的第一环） */

/* lg：内容区开始紧 —— 收紧比例，不删任何东西 */
.shell[data-cw="lg"] .hero{grid-template-columns:minmax(0,1fr) 160px}
.shell[data-cw="lg"] .home-split{grid-template-columns:minmax(0,1.6fr) minmax(272px,1fr)}

/* md：Hero 纵向堆叠（map 暂藏）、行动中心移到工作空间下方（内容完整保留） */
.shell[data-cw="md"] .hero,.shell[data-cw="sm"] .hero,.shell[data-cw="xs"] .hero{grid-template-columns:1fr}
.shell[data-cw="md"] .hero .map,.shell[data-cw="sm"] .hero .map,.shell[data-cw="xs"] .hero .map{display:none}
.shell[data-cw="md"] .hero .grow .row,.shell[data-cw="sm"] .hero .grow .row,.shell[data-cw="xs"] .hero .grow .row{flex-wrap:wrap}
.shell[data-cw="md"] .home-split,.shell[data-cw="sm"] .home-split,.shell[data-cw="xs"] .home-split{grid-template-columns:1fr}
.shell[data-cw="md"] .grid-recent,.shell[data-cw="sm"] .grid-recent,.shell[data-cw="xs"] .grid-recent{grid-template-columns:repeat(3,1fr)}
.shell[data-cw="md"] .greet .tip,.shell[data-cw="sm"] .greet .tip,.shell[data-cw="xs"] .greet .tip{display:none}

/* sm：组件区给首页让路（首页完整性优先）；工作空间卡 2 列；页边距收紧 */
.shell[data-cw="sm"] .widget-col,.shell[data-cw="xs"] .widget-col{flex-basis:0;width:0;padding-left:0;padding-right:0;border-left:0;overflow:hidden}
.shell[data-cw="sm"] .ws-home,.shell[data-cw="xs"] .ws-home{grid-template-columns:repeat(2,1fr)}
.shell[data-cw="sm"] .ws-home .size-l,.shell[data-cw="xs"] .ws-home .size-l{grid-column:span 2}
.shell[data-cw="sm"] .ws-home .size-m,.shell[data-cw="sm"] .ws-home .size-s,
.shell[data-cw="xs"] .ws-home .size-m,.shell[data-cw="xs"] .ws-home .size-s{grid-column:span 1}
.shell[data-cw="sm"] .page,.shell[data-cw="xs"] .page{padding-left:var(--space-5);padding-right:var(--space-5)}
.shell[data-cw="sm"] .page-head,.shell[data-cw="xs"] .page-head{flex-wrap:wrap}
/* sm 档 AI 栏收成竖条（与窗口 1180 档同构，尊重 force-open） */
.shell[data-cw="sm"] .ai-dock,.shell[data-cw="xs"] .ai-dock{flex-basis:48px;width:48px}
.shell[data-cw="sm"] .ai-dock .dock-panel,.shell[data-cw="xs"] .ai-dock .dock-panel{display:none}
.shell[data-cw="sm"] .ai-dock .dock-rail,.shell[data-cw="xs"] .ai-dock .dock-rail{display:flex}
.shell[data-cw="sm"] .ai-dock.force-open:not(.collapsed){flex-basis:var(--ai-panel-w);width:var(--ai-panel-w)}
.shell[data-cw="sm"] .ai-dock.force-open:not(.collapsed) .dock-panel{display:flex}
.shell[data-cw="sm"] .ai-dock.force-open:not(.collapsed) .dock-rail{display:none}

/* xs：兜底档 —— 单列排布，不重叠、不震颤（导航折叠由 10d 状态机管） */
.shell[data-cw="xs"] .page{padding-left:var(--space-4);padding-right:var(--space-4)}
.shell[data-cw="xs"] .grid-recent{grid-template-columns:repeat(2,1fr)}
.shell[data-cw="xs"] .ws-home{grid-template-columns:1fr}
.shell[data-cw="xs"] .ws-home .size-l,.shell[data-cw="xs"] .ws-home .size-m,.shell[data-cw="xs"] .ws-home .size-s{grid-column:span 1}

/* ==========================================================================
   10d. UI-04-C-P0：工作台响应状态机（chrome 策略）—— shell[data-rs] =
   full / compact / collapsed / fallback（阈值与滞回见 JS initRS）。
   状态切换只改 chrome（导航/AI/组件区），内容排布仍走 10b 的 data-cw。
   ========================================================================= */
/* COMPACT：桌面三栏结构保留，收紧 chrome —— 导航 min(用户宽,180)、
   AI 面板 min(用户宽,260)（用户本来就收窄则尊重用户值） */
.shell[data-rs="compact"] .sidebar{flex-basis:min(var(--sidebar-w),180px);width:min(var(--sidebar-w),180px)}
.shell[data-rs="compact"] .ai-dock:not(.collapsed){flex-basis:min(var(--ai-panel-w),260px);width:min(var(--ai-panel-w),260px)}
/* COMPACT 起组件区让路（核心结构 = 导航 + 工作区 + AI，组件区是增值侧挂） */
.shell[data-rs="compact"] .widget-col,
.shell[data-rs="collapsed"] .widget-col,
.shell[data-rs="fallback"] .widget-col{flex-basis:0;width:0;padding-left:0;padding-right:0;border-left:0;overflow:hidden}
/* COLLAPSED / FALLBACK：辅助区折叠 —— AI 收成竖条入口按钮（无视 force-open，
   极限空间下不允许面板展开），导航由 JS 经 .mini 切图标态 */
.shell[data-rs="collapsed"] .ai-dock,.shell[data-rs="fallback"] .ai-dock,
.shell[data-rs="collapsed"] .ai-dock.force-open:not(.collapsed),
.shell[data-rs="fallback"] .ai-dock.force-open:not(.collapsed){flex-basis:48px;width:48px}
.shell[data-rs="collapsed"] .ai-dock .dock-panel,
.shell[data-rs="collapsed"] .ai-dock.force-open:not(.collapsed) .dock-panel,
.shell[data-rs="fallback"] .ai-dock .dock-panel,
.shell[data-rs="fallback"] .ai-dock.force-open:not(.collapsed) .dock-panel{display:none}
.shell[data-rs="collapsed"] .ai-dock .dock-rail,
.shell[data-rs="collapsed"] .ai-dock.force-open:not(.collapsed) .dock-rail,
.shell[data-rs="fallback"] .ai-dock .dock-rail,
.shell[data-rs="fallback"] .ai-dock.force-open:not(.collapsed) .dock-rail{display:flex}

/* ==========================================================================
   10e. UI-05-P0：窗口编排系统 —— active 窗口 / 角色标注 / 吸附预览。
   零新 token、零新 keyframes：预览淡入复用既有 fadeIn + dur-fast。
   ========================================================================= */
/* 非活动窗口轻微降权（拖拽 carrying 态的 .72 优先级更高，用 :not(.carrying) 避让） */
.stage:not(.carrying) .win:not(.sel){opacity:.85}
/* 窗口角色标注：active 常显「● 当前工作窗口」，其余悬停才显「辅助窗口」——不加重视觉负担 */
.win-role{display:none;margin-left:auto;margin-right:var(--space-2);font-size:var(--fs-caption);color:var(--text-3);white-space:nowrap}
.win.sel .win-role{display:block}
.win.sel .win-role::before{content:"● 当前工作窗口";color:var(--brand-600)}
.win:not(.sel):hover .win-role{display:block}
.win:not(.sel):hover .win-role::before{content:"辅助窗口"}
/* 吸附预览：纯视觉反馈层，pointer-events:none，绝不影响 1:1 跟手 */
.snap-ghost{position:absolute;display:none;z-index:5;pointer-events:none;
  border:2px dashed var(--brand-400);border-radius:var(--r-lg);background:var(--brand-50);opacity:.9;
  animation:fadeIn var(--dur-fast) var(--ease-out)}
/* 交换/插入变体：实线框 + 中央文字提示（swap/insert 走窗口间关系，与舞台边缘虚线区分） */
.snap-ghost.swap,.snap-ghost.insert{border-style:solid;border-color:var(--brand-500)}
.snap-ghost::after{content:"";position:absolute;inset:0;display:grid;place-items:center;
  font-size:var(--fs-caption);font-weight:600;color:var(--brand-700);letter-spacing:.02em}
.snap-ghost.swap::after{content:"交换位置"}
.snap-ghost.insert::after{content:"插入分屏"}

/* ==========================================================================
   10c. UI-04-C：全局滚动体验 —— 无跳宽（gutter 稳定）、滚动不串层（contain）、
   内层滚动区统一细滚动条（原来只有 .view 有，抽屉/AI 消息是系统默认粗条）
   ========================================================================= */
.view{scrollbar-gutter:stable}
.view,.drawer-body,.ai-msgs,.ai-session-list,.wscroll,.modal{overscroll-behavior:contain}
.drawer-body::-webkit-scrollbar,.ai-msgs::-webkit-scrollbar,.ai-session-list::-webkit-scrollbar{width:8px}
.drawer-body::-webkit-scrollbar-thumb,.ai-msgs::-webkit-scrollbar-thumb,.ai-session-list::-webkit-scrollbar-thumb{
  background:var(--border-strong);border-radius:99px;border:2px solid transparent;background-clip:content-box}
.drawer-body::-webkit-scrollbar-thumb:hover,.ai-msgs::-webkit-scrollbar-thumb:hover,.ai-session-list::-webkit-scrollbar-thumb:hover{
  background:var(--text-4);background-clip:content-box;border:2px solid transparent}
.drawer-body::-webkit-scrollbar-track,.ai-msgs::-webkit-scrollbar-track,.ai-session-list::-webkit-scrollbar-track{background:transparent}
/*#APPEND#*/
</style>

/* ==========================================================================

   ========================================================================= */
/* 侧挂插件组件区：用户自己决定放什么、放第几个 */

/* 组件区内容渲染 */

/* -------------------------------------------------------------------------
   右键菜单：跟随鼠标，自动避开视口边界
   items: [{icon,label,danger,disabled,act,data,kbd} | 'sep' | {head:'...'}]
   ------------------------------------------------------------------------- */
function ctxMenu(x, y, items){
  closeCtx();
  const boxW = 200, boxH = items.length * 34 + 12;
  const left = Math.min(x, innerWidth - boxW - 8);
  const top  = Math.min(y, innerHeight - boxH - 8);
  const el = document.createElement('div');
  el.className = 'ctx-menu'; el.id = 'ctxMenu';
  el.style.left = left + 'px'; el.style.top = top + 'px';
  el.innerHTML = items.map(it=>{
    if(it === 'sep') return `<div class="ctx-sep"></div>`;
    if(it.head) return `<div class="ctx-head">${it.head}</div>`;
    return `<button class="ctx-item${it.danger?' danger':''}" data-act="${it.act||'ctx-close'}"
      ${it.data||''} ${it.disabled?'disabled':''}>
      ${it.icon?ico(it.icon,15):''}<span>${it.label}</span>
      ${it.kbd?`<span class="kbd">${it.kbd}</span>`:''}</button>`;
  }).join('');
  document.body.appendChild(el);
}
function closeCtx(){ const e = document.getElementById('ctxMenu'); if(e) e.remove(); }

/* -------------------------------------------------------------------------
   通用拖拽排序
   mode='move'（默认）：插入排序；mode='swap'：交换位置并继承对方的视觉占比
   ★ 关键 1：拖拽只在 DOM 上局部换位，绝不调用 render() —— 整页重绘 + scrollTop 归零
     会产生"刷新"的观感。回调里只更新数据与静默播报。
   ★ 关键 2：swap 只交换"尺寸"，其余参数（明暗度 / 不透明度 / 色调 / 边框 / 动效）
     一律跟着对象本身走，不随槽位互换。
   ------------------------------------------------------------------------- */
/* 交换两个兄弟节点（不重建、不重绘） */
function swapNodes(a, b){
  if(!a || !b || a === b) return;
  const p = a.parentNode; if(!p) return;
  const an = a.nextSibling, bn = b.nextSibling;
  if(an === b) p.insertBefore(b, a);
  else if(bn === a) p.insertBefore(a, b);
  else { p.insertBefore(b, an); p.insertBefore(a, bn); }
}
/* 只交换"尺寸"，其余一切参数（明暗度 / 不透明度 / 色调 / 边框 / 动效…）原样跟着对象走。
   做法：不整块换 className 与 style —— 那是"连人带衣服一起换"，会把对方的暗态、
   半透明一起换过来。这里改成白名单制：只有下面这些算尺寸，别的碰都不碰。 */
const SIZE_CLASS_RE = /\bsize-[a-z]+\b/;                 // 例：size-l / size-m / size-s
const SIZE_STYLE_PROPS = [                               // 只影响占位大小的属性
  'grid-column','grid-row','grid-column-start','grid-column-end',
  'grid-row-start','grid-row-end','grid-area',
  'width','height','min-width','min-height','max-width','max-height',
  'flex','flex-grow','flex-basis','aspect-ratio'
];
function swapSize(a, b){
  if(!a || !b || a === b) return;
  // 1) class：只搬 size-* 这一个 token，其余 class（暗态、选中、禁用…）留在原节点
  const ca = (a.className.match(SIZE_CLASS_RE) || [])[0];
  const cb = (b.className.match(SIZE_CLASS_RE) || [])[0];
  if(ca) a.classList.remove(ca);
  if(cb) b.classList.remove(cb);
  if(cb) a.classList.add(cb);
  if(ca) b.classList.add(ca);
  // 2) inline style：只搬白名单里的尺寸属性，opacity / filter(brightness) / background 等一律不动
  const va = {}, vb = {};
  SIZE_STYLE_PROPS.forEach(p=>{ va[p] = a.style.getPropertyValue(p); vb[p] = b.style.getPropertyValue(p); });
  SIZE_STYLE_PROPS.forEach(p=>{
    const pa = a.style.getPropertyPriority(p), pb = b.style.getPropertyPriority(p);
    a.style.removeProperty(p); b.style.removeProperty(p);
    if(vb[p]) a.style.setProperty(p, vb[p], pb);
    if(va[p]) b.style.setProperty(p, va[p], pa);
  });
}
const flash = el => { if(!el) return; el.classList.remove('just-swap'); void el.offsetWidth; el.classList.add('just-swap'); };
/* 重播同一个动画：先摘掉 class、强制重排、再加回去（否则连续两次不会重播） */
const once = (el, cls) => { if(!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
const okFlash  = el => once(el, 'ok-flash');    // 成功：闪一圈描边
const errShake = el => once(el, 'err-shake');   // 错误：小幅横向纠正

/* FLIP：先量旧位置 → 改 DOM → 从旧位置动画回新位置。
   只给"被挤开的邻居"做位移，被拖的那一个（skip）不参与 —— 它跟着光标走。 */
function flip(nodes, mutate, dur, skip){
  if(dur < 20 || !nodes.length){ mutate(); return; }        // off / reduced：直接到位
  const first = new Map();
  nodes.forEach(el=>{ if(el !== skip) first.set(el, el.getBoundingClientRect()); });
  mutate();
  const moved = [];
  first.forEach((r0, el)=>{
    const r1 = el.getBoundingClientRect();
    const dx = r0.left - r1.left, dy = r0.top - r1.top;
    if(Math.abs(dx) > .5 || Math.abs(dy) > .5) moved.push([el, dx, dy]);
  });
  if(!moved.length) return;
  moved.forEach(([el, dx, dy])=>{                            // First → 反向位移回旧位置
    el.style.transition = 'none';
    el.style.transform = `translate(${dx}px, ${dy}px)`;
    el.style.willChange = 'transform';
  });
  requestAnimationFrame(()=>{                                // Last → 松手，让它滑回真实位置
    moved.forEach(([el])=>{
      el.style.transition = `transform ${dur}ms var(--mt-ease-out)`;
      el.style.transform = 'translate(0, 0)';
    });
    setTimeout(()=>{ moved.forEach(([el])=>{
      el.style.transition=''; el.style.transform=''; el.style.willChange='';
    }); }, dur + 40);
  });
}

function enableSort(container, itemSel, onReorder, mode){
  if(!container) return;
  let src = null, originFrom = -1, busy = false;
  const dur = () => mtMs('--mt-dur-reorder', 160);
  const items = () => [...container.querySelectorAll(itemSel)];
  const clean = ()=>{
    container.querySelectorAll('.drop-target').forEach(n=>n.classList.remove('drop-target'));
  };
  const end = ()=>{
    document.body.classList.remove('is-dragging');           // 解除 Motion Priority
    if(src) src.classList.remove('dragging');
    clean(); src = null; originFrom = -1;
  };
  container.querySelectorAll(itemSel).forEach(el=>{
    el.addEventListener('dragstart', e=>{
      src = el; originFrom = items().indexOf(el);
      el.classList.add('dragging');
      document.body.classList.add('is-dragging');            // Hover 让位给 Drag
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain',''); }catch(_){}
    });
    el.addEventListener('dragend', end);
    el.addEventListener('dragover', e=>{
      if(!src || src === el) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      if(mode === 'swap'){ clean(); el.classList.add('drop-target'); return; }
      /* move：实时让位 —— 邻居 120–180ms 滑开，不等落点确认 */
      if(busy) return;                                       // 动画中不排队、不追问
      const list = items();
      const from = list.indexOf(src), to = list.indexOf(el);
      if(from < 0 || to < 0 || from === to) return;
      const ref = from < to ? list[to].nextSibling : list[to];
      if(src.nextSibling === ref) return;
      busy = true;
      flip(list, ()=>container.insertBefore(src, ref), dur(), src);
      setTimeout(()=>{ busy = false; }, dur());
    });
    el.addEventListener('dragleave', ()=> el.classList.remove('drop-target'));
    el.addEventListener('drop', e=>{
      e.preventDefault();
      if(!src || src === el) return;
      el.classList.remove('drop-target');
      const list = items();
      const to = list.indexOf(el);
      if(mode === 'swap'){
        if(originFrom < 0 || to < 0 || originFrom === to) return;
        const A = list[to], B = src;                         // 落点元素 ↔ 被拖元素
        flip([A, B], ()=>{ swapNodes(A, B); swapSize(A, B); }, dur(), null);
        flash(A); flash(B);
        onReorder(originFrom, to);
      } else {
        const finalTo = list.indexOf(src);
        if(originFrom < 0 || finalTo < 0 || originFrom === finalTo) return;
        flash(src);
        onReorder(originFrom, finalTo);                      // 只更新数据与提示，禁止 render
      }
    });
  });
}

  const arm = ()=>{
