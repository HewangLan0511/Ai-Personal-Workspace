        if(k === 'content') continue;
        const cur = startChainW[k];
        const give = Math.min(deficit, Math.max(0, cur - AREA_MIN[k]));
        if(give > 0){ state.w[k] = cur - give; deficit -= give; }
        /* 已经压到最小值还缺 → 折叠它，把折叠省下的空间也交出来 */
        if(deficit > .5 && cur - give <= AREA_MIN[k] + .5 && canFoldArea(k) && !isFoldedArea(k)){
          const before = areaW(k);
          foldArea(k, true);
          deficit -= Math.max(0, before - areaW(k));
          autoFolded[k] = true;
        }
      }
      applyWidths();
    } else if(deficit <= .5 && Object.keys(autoFolded).length){
      /* 往回拖：压力解除，被级联折叠的区域依次展开并还原到起始宽度 —— 手势是连续的一件事 */
      let restored = false;
      for(const k of chain){
        if(!autoFolded[k]) continue;
        if(isFoldedArea(k)){ unfoldArea(k); state.w[k] = startChainW[k]; restored = true; }
        delete autoFolded[k];
      }
      if(restored) applyWidths();
    }
  };
  const flush = ()=>{
    raf = 0;
    state.w[key] = next; applyWidths();
    /* ★ 折叠态往展开方向拉：宽度用 inline 连续跟手（从折叠宽度拉向展开阈值），
       展开速率完全由拖拽速度决定；边界线点亮（.pull）标记"阈值就在手里"，
       到达阈值时脉冲提示 + 略微停顿（见下方 crestUntil 段），停顿后重锚基准继续跟手。
       文字的逐步显现交给 .lbl 自己的过渡（120ms 延迟 + 淡入）。
       往回拖则缩回折叠宽度，不会反向撑开。 */
    if(c.foldW && folded()){
      const pulled = clampN(rawNext, c.foldW, c.expandAt || c.min);
      host.style.flexBasis = pulled + 'px'; host.style.width = pulled + 'px';
      h.classList.add('pull');   /* 折叠态拖拽中：边界线点亮 = "阈值就在你手里" */
    } else if(host.style.width){
      host.style.flexBasis = ''; host.style.width = '';   // 已展开：交还给宽度变量接管
      h.classList.remove('pull');
    }
    cascade();
    /* ★ 到达阈值：边缘脉冲提示 + 略微停顿（用户 2026-09-14 定稿，替代磁吸方案）。
       展开速率完全由拖拽速度决定，不做任何自动滑行；停顿只是让用户反应过来
       "已到完全展开宽度、可以松手"。停顿结束后重锚拖拽基准，继续跟手且无跳变。
       AI 栏同一套标准（rebuildAi 只在 unfold 里，crest 类挂在手柄上不受影响）。 */
    if(c.expandAt && folded() && rawNext >= c.expandAt){
      next = c.expandAt;
      state.w[key] = next; applyWidths();
      host.style.flexBasis = ''; host.style.width = '';   // inline 让位，宽度变量接管
      h.classList.remove('pull');
      h.classList.add('crest');                           // 边缘脉冲：提示一下
      setTimeout(()=>h.classList.remove('crest'), 560);
      crestUntil = Date.now() + mtMs('--mt-dur-nav', 260); // 略微停顿，给人反应时间
      unfold();
    }
    if(next <= c.min) arm(); else disarm();
  };
  h.addEventListener('pointerdown', e=>{
    if(e.button !== 0) return;
    e.preventDefault();
    on = true; moved = false; crestUntil = 0; startX = e.clientX; pid = e.pointerId;
    startedFolded = folded();
    vSmooth = 0; lastRaw = 0; lastRawT = e.timeStamp || 0;
    clearTimeout(flingT); flingT = 0; host.style.transition = '';   // 上一次滑行未完成也要清干净
    /* 用实际渲染宽度做起点：折叠态下它是 64，而 state.w 还记着 236 */
    startW = host.getBoundingClientRect().width;
    rawNext = startW;
    /* 上限 = 整条挤压链能交出来的空间总和（含"折叠"能释放的那部分），
       而不只是主视窗的富余 —— 否则主视窗一到 680 就拖不动了。 */
    Object.keys(startChainW).forEach(k=>delete startChainW[k]);
    Object.keys(autoFolded).forEach(k=>delete autoFolded[k]);
    let room = 0;
    chain.forEach(k=>{
      startChainW[k] = areaW(k);
      room += Math.max(0, startChainW[k] - AREA_MIN[k]);
      if(canFoldArea(k) && !isFoldedArea(k)) room += (FOLD_REL[k] || 0);
    });
    cap = Math.max(c.min, Math.min(c.max, startW + room));
    h.classList.add('on');
    document.body.classList.add('is-resizing');   // 关掉宽度过渡 + 统一光标 + 禁选中
    try{ h.setPointerCapture(e.pointerId); }catch(_){}
  });
  h.addEventListener('pointermove', e=>{
    if(!on) return;
    moved = true;
    rawNext = startW + (e.clientX - startX) * c.dir;
    next = clampN(rawNext, c.min, cap);
    /* 松手速度采样：惯性滑行的初速度（指数平滑，去指针抖动） */
    {
      const now = e.timeStamp || Date.now();
      if(lastRawT){
        const dt = now - lastRawT;
        if(dt > 0){
          const v = (rawNext - lastRaw) / dt;
          vSmooth = vSmooth ? vSmooth * 0.7 + v * 0.3 : v;
        }
      }
      lastRaw = rawNext; lastRawT = now;
    }
    if(crestUntil){
      if(Date.now() < crestUntil){
        next = c.expandAt;                     // 阈值停顿期：宽度钉住，给人反应时间
      } else {
        /* 重锚：把拖拽基准平移到"当前指针 = 阈值宽度"，停顿结束继续 1:1 跟手，无跳变 */
        startX = e.clientX - (c.expandAt - startW) * c.dir;
        rawNext = c.expandAt; next = c.expandAt;
        crestUntil = 0;
      }
    }
    if(!raf) raf = requestAnimationFrame(flush);  // 一帧最多改一次宽度
  });
  const end = e=>{
    if(!on) return;
    on = false;
    h.classList.remove('on');
    h.classList.remove('pull');                 // 阈值线点亮只属于"拖拽进行中"
    crestUntil = 0;                             // 停顿期只属于本次拖拽
    document.body.classList.remove('is-resizing');
    try{ if(e && e.pointerId != null) h.releasePointerCapture(e.pointerId); }catch(_){}
    if(raf){ cancelAnimationFrame(raf); raf = 0; }
    disarm();                                   // 松手就解除蓄力
    if(moved){ state.w[key] = next; applyWidths(); }
    /* 清掉折叠态拖拽期间的 inline 宽度覆盖 —— 变量优先级低于 inline，不清则变量永远不生效 */
    host.style.flexBasis = ''; host.style.width = '';
    /* ★ 判定二（2026-09-14 定稿）：折叠态往外拖、未到阈值就松手 ——
       边缘从当前位置、以松手瞬间速度起，速度递减滑行到展开态最小宽度（expandAt），
       到位后摘壳展开（内容走各自过渡）。滑行时长由松手速度推得：速度越快越快到位，
       ease-out 递减。基本没拉开就松手（≤ foldW+12px）不算"滑动一段距离"，保持折叠。
       ★ 滑行必须走 inline 宽度：.mini/.collapsed 类用 --sidebar-w-mini/--ai-panel-w 之外自己的
         48/64px 压着宽度变量，写变量等于没写；inline 到位摘壳后才交还给变量（顺序不能反）。 */
    if(startedFolded && folded() && moved && rawNext > c.foldW + 12 && rawNext < c.expandAt){
      const from = host.getBoundingClientRect().width;
      const dist = Math.max(1, c.expandAt - from);
      const dur = clampN(Math.round(dist / Math.max(Math.abs(vSmooth), 0.06) * 1000 * 1.15), 180, 520);
      state.w[key] = c.expandAt; applyWidths();        // 摘壳后变量就位，与 inline 无缝交接
      host.style.transition = `flex-basis ${dur}ms var(--mt-ease-out), width ${dur}ms var(--mt-ease-out)`;
      host.style.flexBasis = c.expandAt + 'px'; host.style.width = c.expandAt + 'px';
      clearTimeout(flingT);
      flingT = setTimeout(()=>{
        flingT = 0;
        host.style.transition = '';
        unfold();                                      // 先摘壳（mini 类撤掉，变量已是 expandAt）
        host.style.flexBasis = ''; host.style.width = '';   // 再交还变量：同宽无跳变
        h.classList.remove('pull');
        h.classList.add('crest');                      // 到位：边缘脉冲，与越阈到达同一反馈
        setTimeout(()=>h.classList.remove('crest'), 560);
      }, dur + 20);
    }
    /* 兜底：没等到 dwell 就松手，只要落在折叠区里也照样折叠 */
    if(moved && c.foldAt && next <= c.foldAt && !folded()) fold();
    else if(moved && !folded() && next !== startW) announce(`${c.name}宽度 ${Math.round(state.w[key])} 像素`);
    pid = null;
  };
  h.addEventListener('pointerup', end);
  h.addEventListener('pointercancel', end);
  /* 兜底：手柄万一在拖拽中被隐藏或移出 DOM，pointerup 就再也送不到它身上，
     end 不执行 → is-resizing 残留 → 其余手柄全被 pointer-events:none 锁死。
     挂到 window 上，无论指针在哪抬起都能收尾。 */
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
  h.addEventListener('dblclick', ()=>{           // 双击回到默认宽度
    state.w[key] = c.def; applyWidths(); announce(`${c.name}宽度已重置`);
  });
  h.addEventListener('keydown', e=>{             // 键盘同样可调：方向键 ±16，Shift ±48
    if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    const step = (e.shiftKey ? 48 : 16) * (e.key === 'ArrowRight' ? 1 : -1) * c.dir;
    state.w[key] = clampN(state.w[key] + step, c.min, c.max);
    applyWidths();
    announce(`${c.name}宽度 ${Math.round(state.w[key])} 像素`);
  });
}
/* 手柄是容器的子节点，而 paint() 会重写这三个容器的 innerHTML —— 所以每次刷完要补回去。
   节点是同一个，事件只在第一次创建时绑一次，不会越绑越多。 */
function mountHandles(){
  [['#sidebar','nav'], ['#widgetCol','widget'], ['#aiDock','ai']].forEach(([sel, key])=>{
    const host = document.querySelector(sel);
    if(!host) return;
    let h = host.querySelector('.rsh--' + key);
    if(!h){
      h = document.createElement('div');
      h.className = 'rsh rsh--' + key;
      h.setAttribute('role','separator');
      h.setAttribute('aria-orientation','vertical');
      h.setAttribute('aria-label','调整' + RESIZE_CONF[key].name + '宽度');
      h.title = '拖动调整宽度 · 双击重置 · 方向键微调';
      h.tabIndex = 0;
      enableResize(h, key, host);
    }
    if(h.parentNode !== host) host.appendChild(h);
  });
}

/* Toast 规则：同一时刻最多 2 条；第 3 条进来时自动**淡出**最旧的一条（不许硬删）；
   每条既可点击关闭，也会在 2.2s 后自动淡出。
   ★ 计时器必须按条独立——旧实现共享一个 toastTimer，新弹窗 clearTimeout 会
   取消旧弹窗的自动消失，导致弹窗滞留不退（这正是"底部弹窗不消失"的 bug）。 */
function dismissToast(el){
  if(!el || el.dataset.out) return;              // 已在退场中，不重复播
  el.dataset.out = '1';
  el.style.pointerEvents = 'none';               // 退场中不可再点
  const outMs = mtMs('--mt-dur-toast-out', 120);
  el.classList.add('out');
  setTimeout(()=>el.remove(), Math.max(outMs, 20));
}
function toast(msg, icon){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast';
  el.title = '点击关闭';
  el.innerHTML = `${ico(icon||'check-c',16)}<span>${msg}</span>`;
  el.addEventListener('click', ()=>dismissToast(el));
  host.appendChild(el);
  /* 超额挤旧：对最旧的多余项走同一套 dismissToast 淡出，绝不直接 remove */
  [...host.querySelectorAll('.toast:not([data-out])')].slice(0, -2)
    .forEach(t=>dismissToast(t));
  setTimeout(()=>dismissToast(el), 2200);        // 每条独立的自动消失
}
/* 浮层（Modal / Drawer / 右键菜单）统一退场：先播 .out，再清空 layer。
   ★ 直接 layer.innerHTML='' 会让弹层"啪"地消失——退场动画根本没机会播。 */
function closeLayer(){
  if(!layer.firstChild || layer.dataset.closing) return;
  const outMs = Math.max(mtMs('--mt-dur-modal', 180), mtMs('--mt-dur-drawer', 240));
  const anim = layer.querySelector('.scrim, .modal, .drawer, .ctx-menu');
  if(!anim || outMs < 20){ layer.innerHTML = ''; return; }   // off：直接消失
  layer.dataset.closing = '1';
  layer.querySelectorAll('.scrim, .modal, .drawer, .ctx-menu').forEach(n=>n.classList.add('out'));
  setTimeout(()=>{ layer.innerHTML = ''; delete layer.dataset.closing; }, outMs);
}
/* 静默播报：只进 aria-live，不弹任何可见提示。
   适用：拖拽换位、排序这类"结果肉眼可见"的操作 —— 视觉反馈已经给足（描边高亮），
   再弹一条居中提示条就是噪音，还会打断连续拖拽。 */
function announce(msg){
  const r = document.getElementById('liveRegion');
  if(!r) return;
  r.textContent = '';
  setTimeout(()=>{ r.textContent = msg; }, 30);
}

const ROUTES = {};
/* -------------------------------------------------------------------------
   Motion Guard：standard / reduced / off
   off 只关动画，不关交互状态本身（hover / press / focus / 状态色都还在）
   ------------------------------------------------------------------------- */
function setMotion(m){
  state.motion = m;
  const root = document.documentElement;
  if(m === 'standard') root.setAttribute('data-motion','standard');
  else root.setAttribute('data-motion', m);
}
/* 读取 motion token 的毫秒值（用于 JS 编排：等离场播完再换 DOM） */
function mtMs(name, fallback){
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  if(!v) return fallback;
  const n = parseFloat(v);
  if(isNaN(n)) return fallback;
  return v.endsWith('ms') ? n : (v.endsWith('s') ? n * 1000 : n);
}

let sceneSeq = 0;        // 页面切换序号：A→B→C→D 时中间动画被取消，只最终到 D
let homeEntered = false; // 首页 Entrance 只在第一次进入时播放

function render(opts){
  const scene = !!(opts && opts.scene);
  if(!scene){ paint(false); return; }          // 局部刷新：不播场景动画、不动滚动位置
  const token = ++sceneSeq;
  const cur = view.firstElementChild;
  const outMs = mtMs('--mt-dur-scene-out', 80);
  if(!cur || outMs < 20){ paint(true); return; }
  cur.classList.remove('scene-in');
  cur.classList.add('scene-out');
  setTimeout(()=>{ if(token === sceneSeq) paint(true); }, outMs);
}

  if(fk){                                     // 按"身份"把焦点还回去
    const n = document.querySelector(`[data-act="${fk.act}"]`
      + (fk.v ? `[data-v="${fk.v}"]` : '') + (fk.r ? `[data-r="${fk.r}"]` : '')
      + (fk.id ? `[data-id="${fk.id}"]` : ''));
    if(n) n.focus({preventScroll:true});
  }
  if(scene && r === 'home' && !homeEntered){ homeEntered = true; playEntrance(); }
}

/* 首页首入：Hero → Workspace → Secondary，总时长落在 400–520ms，只在第一次进入播放。
   做法：单个元素时长取 token（180–240），用"总时长反推步长"而不是固定 stagger，
   这样无论首屏有几个区块，整段入场都稳定在 400–520ms 内，不会区块一多就拖成 1s。 */
function playEntrance(){
  const els = [...view.querySelectorAll('[data-enter]')];
  if(!els.length) return;
  const durOf = k => mtMs(k === 'hero' ? '--mt-dur-entrance'
                        : k === 'ws'   ? '--mt-dur-entrance-ws'
                                       : '--mt-dur-entrance-2', 200);
  const maxDur = Math.max(...els.map(el=>durOf(el.dataset.enter)));
  if(maxDur < 20) return;                                   // off：直接到位
  const total = Math.min(Math.max(maxDur * 2, 400), 520);
  const step  = els.length > 1 ? (total - maxDur) / (els.length - 1) : 0;
  els.forEach((el,i)=>{
    const d = durOf(el.dataset.enter);
    el.classList.add('enter-up');
    el.style.animationDuration = d + 'ms';
    el.style.animationDelay = Math.round(step * i) + 'ms';
  });
}

/* Workspace Cinema：0–240 主体 → 240 GATE → 240–560 后台稳定 */
function playCinema(){
  if(mtMs('--mt-dur-window', 200) < 20) return;      // off：直接到位
  document.querySelectorAll('.stage .win').forEach((w,i)=>w.style.setProperty('--i', i));
  shell.classList.add('cinema-entering');
  setTimeout(()=>{                                    // 240ms：交互门限
    shell.classList.remove('cinema-entering');
    shell.classList.add('cinema-stabilizing');
  }, 240);
  setTimeout(()=>{ shell.classList.remove('cinema-stabilizing'); }, 560);
}
/* ★ S2 局部 diff：设置页切换分类只换 .set-body 这一块 DOM，不整页重绘。
   整页 paint() 会连带重建侧栏、AI 侧栏、组件区与页头，还会丢输入框 ——
   对"换个分类"这种局部变化来说，代价完全不必要。
   这也是 View Transitions 的入场券（D1）：局部更新不该触发场景级动画。 */
function patchSettings(rebuildNav){
  const page = view.querySelector('.set-layout');
  if(!page){ render(); return; }              // 不在设置页 → 退回整绘
  const ae = document.activeElement;
  const keepFocus = !!(ae && ae !== document.body && page.contains(ae));
  if(rebuildNav){
    const nav = page.querySelector('.subnav');
    if(nav) nav.innerHTML = setNavHtml();      // 分类项增减（开发者模式）时才重建导航
  } else {
    page.querySelectorAll('[data-act="set-cat"]').forEach(b=>{
      b.classList.toggle('active', b.dataset.v === state.setCat);
    });
  }
  const sb = page.querySelector('.set-body');
  if(!sb) return;
  sb.innerHTML = setBodyHtml(state.setCat);
  /* 只有内容区被替换：侧栏 / AI 侧栏 / 组件区 / 页头 / 手柄全都没动，
     所以这里不调 mountHandles()，也不碰 scrollTop —— 局部更新就该是局部的。
     注意 render() 那条路径不用 once()：那里 .set-body 是新节点，动画天然首播。 */
  once(sb, 'swap-in');
  if(keepFocus){                               // 内容被换掉了，焦点按"身份"落到当前分类项
    const n = page.querySelector(`[data-act="set-cat"][data-v="${state.setCat}"]`);
    if(n) n.focus({preventScroll:true});
  }
}
/* /plugins 页同理：切一个插件开关，真正变的只有"启用中 N 个"这个数字和开关自己，
   页头那行字以前是靠整页 render() 顺带刷的 —— 现在直接改文本。 */
function patchPluginCount(){
  const c = document.getElementById('plugCount');
  if(!c){ if(state.route === 'plugins') render(); return; }   // 不在插件页 → 退回整绘
  c.textContent = `已安装 ${PLUGINS.length} 个 · ${PLUGINS.filter(p=>p.on).length} 个启用中 · 权限在插件详情里管理`;
}
/* 工作模式的自动折叠：退出即恢复；用户在工作模式里手动展开过，本次就不再自动收 */
function syncNavAuto(isRun){
  if(!isRun) state.navRunExpanded = false;
  state.navAutoMini = isRun && !state.navRunExpanded;
}
/* 提前一拍折叠：侧栏在场景离场的 80ms 里就开始收，等窗口 120ms 落位时宽度已经定了，
   不会出现"窗口滑进来的同时地面还在变宽" */
function go(r){
  state.route = r;
  /* 提前一拍：cinema 不再等场景离场结束才加，否则组件区比侧栏晚 80ms 才开始收，
     窗口 120ms 落位时会撞上"右边还在变宽"。 */
  shell.classList.toggle('cinema', r === 'run');
  syncNavAuto(r === 'run');
  applyNavMini();
  location.hash = '#/'+r;
  render({scene:true});
}
/* 拖拽接线：最近使用 / 工作空间卡片 / 侧挂组件区 */
function wireDrag(){
  const rg = document.getElementById('recentGrid');
  if(rg) enableSort(rg, '.app-square', (f,t)=>{
    moveItem(RECENT, f, t); announce(`「${appName(RECENT[t])}」已移到第 ${t+1} 位`);
  });
  const wg = document.getElementById('homeWsGrid') || document.getElementById('wsGrid');
  if(wg) enableSort(wg, '.ws-card', (f,t)=>{
    const a = WS[f], b = WS[t];
    [WS[f], WS[t]] = [b, a];               // 交换位置
    [a.size, b.size] = [b.size, a.size];   // 继承被交换对象的视觉占比大小
    if(state.layoutMode !== 'fixed'){      // 手动调过 → 尊重用户，切固定布局
      state.layoutMode = 'fixed';
      document.querySelectorAll('[data-act="layout"]').forEach(el=>{
        el.classList.toggle('on', el.dataset.v === 'fixed');
      });
    }
    // 不弹 toast：结果肉眼可见，静默播报给读屏即可
    announce(`「${a.name}」与「${b.name}」已交换位置，${a.name} 现在是${sizeName(a.size)}`);
  }, 'swap');
  /* ★ 绑定到卡片的真实父容器 .wscroll，不是 #widgetCol —— enableSort 的
     insertBefore(src, ref) 要求 ref 是 container 的子节点；绑错层级会在
     第一次 dragover 抛 NotFoundError，拖拽静默失效（首页网格 container 就是
     直接父节点所以没事，这里曾经是坏的）。 */
  const wc = document.getElementById('widgetCol');
  const wsc = wc && wc.querySelector('.wscroll');
  if(wsc) enableSort(wsc, '.wcard', widgetSortCb);
}
/* 组件区排序：抽出来给「自定义抽屉」复用 —— 抽屉里改顺序，列里当场跟着变 */
function widgetSortCb(f,t){
  const on = WIDGETS.filter(w=>w.on);
  moveItem(on, f, t);
  let k = 0; for(let i=0;i<WIDGETS.length;i++) if(WIDGETS[i].on) WIDGETS[i] = on[k++];
  announce(`组件顺序已调整，第 ${f+1} 个移到第 ${t+1} 位`);
}
function refreshWidgetCol(){
  const wc = document.getElementById('widgetCol');
  if(!wc) return;
  wc.innerHTML = widgetColHtml();
  const wsc = wc.querySelector('.wscroll');          // 真实父容器，见 wireDrag 注释
  if(wsc) enableSort(wsc, '.wcard', widgetSortCb);   // 新节点，不会重复绑监听
}

/* ==========================================================================
   UI-05-B：工作模式状态系统 —— 状态栏 / 工作目标 / 应用状态 / 模板切换 / 布局结构。
   全部内存 mock：无后端、无真实软件控制；S2 局部更新走 refreshRunStatus()
   （只换 #runStatus 的内容，壳节点、appbar、舞台窗口一概不动）。
   ========================================================================= */
const APP_STATUS = {
  running:['运行中','ok'], waiting:['等待打开','wait'], closed:['已关闭','off'],
};
const LAYOUT_NAME = {free:'自由布局', tile:'自动整理', focus:'聚焦布局'};
function appStatusOf(k){
  const o = state.run.appState[k];
  if(o) return o;
  /* 默认派生：出现在舞台窗口里的 = 运行中，其余 = 等待打开 */
  return (state.route==='run' && document.querySelector(`.win[data-w="${k}"]`)) ? 'running' : 'waiting';
}
function runStatusHTML(w){
  const g = state.run.goal;
  const mode = state.wfModes.find(m=>m.id===state.run.modeId);
  const cl = (state.run.customLayout && state.run.customLayout.ws===w.id) ? state.run.customLayout : null;
  const lm = cl ? (cl.mode||'free') : state.run.layoutMode;
  const layoutTxt = state.run.mode==='auto' ? '自动布局' : `手动调整 · ${LAYOUT_NAME[lm]||LAYOUT_NAME.free}`;
  const list = [...w.apps, 'ai'];
  return `
  <span class="rs-item"><span class="rs-k">当前任务</span>${
    g ? `<span class="chip chip--brand" style="height:24px">${ico('target',13)} 正在进行：${g}</span>`
      : `<button class="chip" style="height:24px" data-act="run-goal-open" title="设置工作目标">${ico('plus',13)} 未设置工作目标</button>`}</span>
  <span class="rs-item rs-apps"><span class="rs-k">应用</span>${list.map(k=>`
    <button class="chip rs-app" data-act="run-app-status" data-v="${k}" title="点击切换状态（演示）">
      <i class="rs-dot ${APP_STATUS[appStatusOf(k)][1]}"></i>${appName(k)}<span class="rs-st">${APP_STATUS[appStatusOf(k)][0]}</span></button>`).join('')}</span>
  <span class="rs-item"><span class="rs-k">布局</span><span class="chip" style="height:24px">${ico('auto',13)} ${layoutTxt}</span></span>
  <span class="rs-item"><span class="rs-k">模式</span><button class="chip" style="height:24px" data-act="run-mode-open" title="切换工作模式">${ico('ws',13)} ${mode ? mode.name : '自定义'}</button></span>
  <span class="grow" style="flex:1"></span>
  <button class="btn btn--ghost btn--sm" data-act="run-struct" title="查看当前窗口关系">${ico('listview',14)} 布局结构</button>`;
}

/* P2：切换模式的准备反馈（纯视觉 mock：不启动软件、不调用系统、不读 AI）。
   独立 overlay（不进 layer）：layer 的退场是异步清空，直接复用会被旧定时器清掉。 */
function runPrepSequence(then){
  let ov = document.getElementById('runPrep');
  if(ov) ov.remove();
  ov = document.createElement('div');
  ov.id = 'runPrep';
  ov.innerHTML = `
    <div class="scrim"></div>
    <div class="modal run-prep" role="dialog" aria-label="准备工作空间">
      <span class="spinner" style="width:22px;height:22px;border-width:2px"></span>
      <div class="t-card">正在准备工作空间...</div>
      <div class="rp-steps">${['恢复应用','恢复布局','同步状态'].map((s,i)=>
        `<div class="rp-step" id="rpStep${i}">${ico(i===2?'check-c':'refresh',14)}<span>${s}</span></div>`).join('')}</div>
    </div>`;
  document.body.appendChild(ov);
  ['恢复应用','恢复布局','同步状态'].forEach((_,i)=>setTimeout(()=>{
    const el = document.getElementById('rpStep'+i);
    if(el) el.classList.add('done');
  }, 340*(i+1)));
  setTimeout(()=>{
    ov.remove();
    if(then) then();
    toast('工作空间已准备完成','check-c');
  }, 340*3 + 380);
}
/* 应用模板：换工作空间 + 目标 + 状态重置。窗口布局走既有 enter 语义（不碰布局核心算法） */
function applyWfMode(m, fromOutside){
  state.run.modeId = m.id; state.run.goal = m.goal;
  state.run.appState = {};                    /* 状态重置为默认派生 */
  const w = WS.find(x=>x.id===m.ws) || WS[0];
  state.run.ws = w.id; state.run.tab = w.apps[0]; state.run.saved = false;
  const cl = state.run.customLayout;
  if(cl && cl.ws === w.id){ state.run.mode='manual'; state.run.layoutMode = cl.mode || 'free'; }
  else { state.run.mode='auto'; state.run.layoutMode='free'; }
  if(fromOutside || state.route!=='run'){ go('run'); } else { render(); }
}

/* P3：布局结构 —— 从舞台 inline 几何实时推导窗口关系（帮助理解当前排布） */
function openRunStruct(){
  const wins = [...document.querySelectorAll('#stageGrid .win')].map(el=>{
    const s = el.style;
    return {app: el.dataset.w,
            x: parseFloat(s.left)||0, y: parseFloat(s.top)||0,
            w: parseFloat(s.width)||0, h: parseFloat(s.height)||0};
  });
  const ov = (a,b)=>Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))*
                   Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
  const rows = wins.map(a=>{
    const floats = wins.some(b=>b!==a && ov(a,b) > 0.3*(a.w*a.h));
    const hpos = a.x < 33 ? '左侧' : (a.x + a.w > 67 ? '右侧' : '居中');
    const desc = floats ? `浮动 · 宽 ${Math.round(a.w)}%`
                        : `${hpos} ${Math.round(a.w)}% · 顶 ${Math.round(a.y)}%`;
    return `<div class="row" style="gap:var(--space-3);padding:var(--space-3) 0;border-bottom:1px solid var(--border-subtle)">
      ${appIcon(a.app,'sm')}<span class="t-sm" style="font-weight:600;flex:0 0 auto">${appName(a.app)}</span>
      <span class="t-cap" style="flex:1;text-align:right">├ ${desc}</span>
    </div>`;
  }).join('');
  layer.innerHTML = `
    <div class="scrim" data-act="close-layer"></div>
    <aside class="drawer" role="dialog" aria-label="布局结构">
      <div class="drawer-head">
        <div class="t-card" style="flex:1">布局结构</div>
        <button class="icon-btn" data-act="close-layer">${ico('x',18)}</button>
      </div>
      <div class="drawer-body">
        <div class="t-cap" style="margin-bottom:var(--space-2)">按当前窗口几何实时推导。</div>
        ${rows || '<div class="t-cap">舞台暂无窗口</div>'}
      </div>
      <div class="drawer-foot">
        <div class="spacer" style="flex:1"></div>
        <button class="btn btn--primary" data-act="close-layer">完成</button>
      </div>
    </aside>`;
}

/* 点击置顶：z-index 递增（固定 5 会让叠放次序退化为 DOM 顺序，点不到最上） */
let winZTop = 5;
function frontWin(win){
  document.querySelectorAll('.win').forEach(w=>w.classList.remove('sel'));
  if(win){
    win.classList.add('sel'); win.style.zIndex = ++winZTop;
    /* 点窗同步上方软件标签卡（appbar on 态 + state.run.tab），局部更新不 render（S2） */
    const app = win.dataset.w;
    if(app){
      state.run.tab = app;
      document.querySelectorAll('.apptab[data-v]').forEach(b=>{
        if(b.dataset.v!=='ai') b.classList.toggle('on', b.dataset.v===app);
      });
    }
  }
}
function initStage(){
  const grid = document.getElementById('stageGrid');
  if(!grid) return;
  const stage = grid.parentElement;
  let drag = null;
  const pct = (px, total) => Math.max(0, Math.min(100, (px/total)*100));
  /* UI-04-A4：最小可用尺寸 + 方向 → 光标。舞台为上限，禁止缩成不可用 / 溢出舞台 */
  const MIN_W = 320, MIN_H = 200;
  const CUR = {n:'ns-resize',s:'ns-resize',e:'ew-resize',w:'ew-resize',ne:'nesw-resize',nw:'nwse-resize',se:'nwse-resize',sw:'nesw-resize'};
  const hudOf = win => {
    let hud = win.querySelector('.win-size');
    if(!hud){ hud = document.createElement('div'); hud.className = 'win-size'; win.appendChild(hud); }
    hud.classList.remove('out');
    return hud;
  };
  grid.querySelectorAll('.win').forEach(win=>{
    win.addEventListener('mousedown', e=>{
      frontWin(win);
      const r = grid.getBoundingClientRect();
      const wr = win.getBoundingClientRect();
      const rz = e.target.closest('.rz');
      if(rz){
        drag = {t:'size', dir:rz.dataset.rz, win, r,
                l0:wr.left-r.left, t0:wr.top-r.top, w0:wr.width, h0:wr.height,
                x:e.clientX, y:e.clientY};
      } else if(e.target.closest('.win-handle')){
        drag = {t:'size', dir:'se', win, r,
                l0:wr.left-r.left, t0:wr.top-r.top, w0:wr.width, h0:wr.height,
                x:e.clientX, y:e.clientY};
      } else if(e.target.closest('.win-bar')){
        drag = {t:'move', win, r, l0:wr.left-r.left, t0:wr.top-r.top, x:e.clientX, y:e.clientY};
      } else drag = null;
      if(drag){
        e.preventDefault();
        document.body.style.cursor = drag.t==='size' ? CUR[drag.dir] : 'grabbing';
        /* 过程反馈与拖动统一：复用 carried（抬起）/ carrying（其余退后），零新动画 */
        win.classList.add('carried'); stage.classList.add('carrying');
        if(drag.t==='size') hudOf(win).textContent = `${Math.round(wr.width)} × ${Math.round(wr.height)}`;
      }
    });
  });
  const onMove = e => {
    if(!drag) return;
    drag.moved = true;
    const {win, r} = drag;
    if(drag.t==='move'){
      win.style.left = pct(drag.l0 + (e.clientX-drag.x), r.width) + '%';
      win.style.top  = pct(drag.t0 + (e.clientY-drag.y), r.height) + '%';
      updateSnap(win);   // UI-05-P0：拖动中只更新预览层，绝不改拖动本身（1:1 跟手不动）
    } else {
      /* 多向 resize：西/北向拖动时位置跟着走；夹紧最小尺寸与舞台边界 */
      const dir = drag.dir, dx = e.clientX-drag.x, dy = e.clientY-drag.y;
      let l = drag.l0, t = drag.t0, w = drag.w0, h = drag.h0;
      if(dir.includes('e')) w = drag.w0 + dx;
      if(dir.includes('s')) h = drag.h0 + dy;
      if(dir.includes('w')){ w = drag.w0 - dx; l = drag.l0 + dx; }
      if(dir.includes('n')){ h = drag.h0 - dy; t = drag.t0 + dy; }
      if(w < MIN_W){ if(dir.includes('w')) l = drag.l0 + drag.w0 - MIN_W; w = MIN_W; }
      if(h < MIN_H){ if(dir.includes('n')) t = drag.t0 + drag.h0 - MIN_H; h = MIN_H; }
      if(l < 0){ w += l; l = 0; }
      if(t < 0){ h += t; t = 0; }
      if(l + w > r.width)  w = r.width  - l;
      if(t + h > r.height) h = r.height - t;
      win.style.left   = pct(l, r.width)  + '%';
      win.style.top    = pct(t, r.height) + '%';
      win.style.width  = pct(w, r.width)  + '%';
      win.style.height = pct(h, r.height) + '%';
      hudOf(win).textContent = `${Math.round(w)} × ${Math.round(h)}`;
    }
    if(state.run.mode==='auto'){
      state.run.mode='manual'; stage.classList.add('manual');
      document.querySelectorAll('[data-act="run-mode"]').forEach(b=>b.classList.toggle('on', b.dataset.v==='manual'));
      refreshRunStatus();   /* UI-05-B：拖拽起手即转手动态，状态栏局部同步（不 render） */
    }
    state.run.saved = false;
  };
  const onUp = ()=>{
    if(drag){
      /* UI-05：吸附落位 —— 松手才动布局，拖动过程从未被干预 */
      if(drag.t==='move' && snapZone){
        const s = snapZone;
        if(s.type==='edge'){
          setWinRect(drag.win, s.zone); flash(drag.win);
          fillRemaining(s.zone, drag.win);          // 剩余空间自动填充
        } else if(s.type==='swap'){
          const a = {x:parseFloat(drag.win.style.left)||0, y:parseFloat(drag.win.style.top)||0,
                     w:parseFloat(drag.win.style.width)||0, h:parseFloat(drag.win.style.height)||0};
          setWinRect(drag.win, {x:parseFloat(s.target.style.left)||0, y:parseFloat(s.target.style.top)||0,
                                w:parseFloat(s.target.style.width)||0, h:parseFloat(s.target.style.height)||0});
          setWinRect(s.target, a);
          flash(drag.win); flash(s.target);
        } else if(s.type==='insert'){
          setWinRect(drag.win, s.zone); setWinRect(s.target, s.otherPart);
          flash(drag.win); flash(s.target);
        }
        state.run.saved=false;
      }
      /* 落位反馈：复用 Motion System 的 just-swap（--mt-dur-highlight），零新增动画 */
      if(drag.moved) flash(drag.win);
      drag.win.classList.remove('carried'); stage.classList.remove('carrying');
      const hud = drag.win.querySelector('.win-size');
      if(hud){ hud.classList.add('out'); setTimeout(()=>hud.remove(), 220); }  // 松手即淡出，不持续显示
    }
    clearSnap();
    drag=null; document.body.style.cursor='';
  };
  document.onmousemove = onMove;
  document.onmouseup = onUp;
  /* 进入工作模式即有 active 窗口（当前标签页优先），桌面感的第一帧 */
  const firstWin = grid.querySelector(`.win[data-w="${state.run.tab}"]`) || grid.querySelector('.win');
  if(firstWin) frontWin(firstWin);
}

/* ==========================================================================
   UI-05-P0：窗口编排 —— tile/focus 布局算法 + 吸附预览。
   算法按窗口数量/当前面积/舞台尺寸推导，不写死某个 n；只写 inline 几何（S2：不 render）。
   ========================================================================= */
/* 平铺：偶数=均分网格（4→2×2），奇数=主窗左侧大区+右列均分（3→主+2） */
function tileRects(n){
  if(n<=0) return [];
  if(n===1) return [{x:0,y:0,w:100,h:100}];
  if(n===2) return [{x:0,y:0,w:50,h:100},{x:50,y:0,w:50,h:100}];
  if(n%2===0){
    const cols=n/2;
    return Array.from({length:n},(_,i)=>({
      x:i%cols*(100/cols), y:Math.floor(i/cols)*50, w:100/cols, h:50}));
  }
  const mainW=62, rest=n-1;
  return [{x:0,y:0,w:mainW,h:100},
    ...Array.from({length:rest},(_,i)=>({x:mainW, y:i*(100/rest), w:100-mainW, h:100/rest}))];
}
/* 聚焦：active 大区 + 其余右列条带（Stage Manager 式） */
function focusRects(n){
  if(n<=1) return tileRects(n);
  const sideW=26, rest=n-1;
  return [{x:0,y:0,w:100-sideW,h:100},
    ...Array.from({length:rest},(_,i)=>({x:100-sideW, y:i*(100/rest), w:sideW, h:100/rest}))];
}
function runWins(){ return [...document.querySelectorAll('#stageGrid .win')]; }
function setWinRect(el, r){
  el.style.left=r.x+'%'; el.style.top=r.y+'%'; el.style.width=r.w+'%'; el.style.height=r.h+'%';
}
function applyRunLayout(mode){
  const grid = document.getElementById('stageGrid'); if(!grid) return;
  const stage = grid.parentElement, wins = runWins(); if(!wins.length) return;
  if(mode==='free'){
    const w = WS.find(x=>x.id===state.run.ws);
    const cl = state.run.customLayout;
    const src = (cl && cl.ws===w.id && (cl.mode||'free')==='free') ? cl.rects : w.layout;
    wins.forEach(el=>{
      const r = (src||[]).find(q=>q.app===el.dataset.w) || {x:5,y:5,w:45,h:60};
      setWinRect(el, r); flash(el);
    });
    state.run.layoutMode = 'free';
  } else {
    /* 排槽：active 优先占主位，其余按当前面积降序（考虑当前窗口大小） */
    const info = wins.map(el=>{ const r = el.getBoundingClientRect();
      return {el, app: el.dataset.w, area: r.width*r.height, active: el.classList.contains('sel')}; });
    info.sort((a,b)=>(b.active-a.active)||(b.area-a.area));
    const rects = mode==='tile' ? tileRects(info.length) : focusRects(info.length);
    info.forEach((it,i)=>{ setWinRect(it.el, rects[i]); flash(it.el); });
    state.run.customLayout = {ws: state.run.ws, mode, rects: info.map((it,i)=>({app:it.app, ...rects[i]}))};
    state.run.layoutMode = mode;
  }
  state.run.mode='manual'; state.run.saved=false;
  stage.classList.add('manual');
  /* 局部同步两组 seg 的 on 态（不 render，S2） */
  document.querySelectorAll('[data-act="run-mode"]').forEach(b=>b.classList.toggle('on', b.dataset.v==='manual'));
  document.querySelectorAll('[data-act="run-layout"]').forEach(b=>b.classList.toggle('on', b.dataset.v===state.run.layoutMode));
  refreshRunStatus();   /* UI-05-B：布局状态（自动布局⇄手动调整·xx）局部同步到状态栏 */
}
/* 吸附：28px 进入范围，只出预览、绝不干预拖动（1:1 跟手）。
   三类分区：edge=舞台边缘半区/最大化（松手后他窗自动填充剩余空间）
            swap=大部压到别的窗上 → 交换位置
            insert=贴近别的窗侧缘 → 插入分屏（两窗各占其半，其余窗口不动） */
const SNAP_DIST = 28;
let snapZone = null;
function clearSnap(){
  snapZone = null;
  const g = document.querySelector('.stage .snap-ghost');
  if(g) g.style.display='none';
}
function winRectPct(el, sr){
  const r = el.getBoundingClientRect();
  return {x:(r.left-sr.left)/sr.width*100, y:(r.top-sr.top)/sr.height*100,
          w:r.width/sr.width*100, h:r.height/sr.height*100};
}
function updateSnap(win){
  const grid = document.getElementById('stageGrid'); if(!grid) return;
  const sr = grid.getBoundingClientRect();
  const wr = win.getBoundingClientRect();
  let z = null;
  if(wr.left - sr.left < SNAP_DIST) z = {type:'edge', zone:{x:0,y:0,w:50,h:100}};
  else if(sr.right - wr.right < SNAP_DIST) z = {type:'edge', zone:{x:50,y:0,w:50,h:100}};
  else if(wr.top - sr.top < SNAP_DIST) z = {type:'edge', zone:{x:0,y:0,w:100,h:100}};
  else {
    const cy = wr.top + wr.height/2;
    for(const o of runWins()){
      if(o===win) continue;
      const or = o.getBoundingClientRect();
      const oPct = winRectPct(o, sr);
      /* 大部压在别的窗上（覆盖其 55% 以上）→ 交换提示；轻微重叠不算，保留用户自由叠放 */
      const ovW = Math.min(wr.right,or.right)-Math.max(wr.left,or.left);
      const ovH = Math.min(wr.bottom,or.bottom)-Math.max(wr.top,or.top);
      const cov = (ovW>0 && ovH>0) ? (ovW*ovH)/(wr.width*wr.height) : 0;
      if(cov > 0.55){ z = {type:'swap', zone:oPct, target:o}; break; }
      /* 垂直不同带不插；贴近 o 左/右缘 → 插入分屏预览（占其半） */
      if(Math.abs(cy-(or.top+or.height/2)) > or.height/2) continue;
      if(Math.abs(wr.right-or.left) < SNAP_DIST){
        z = {type:'insert', zone:{x:oPct.x, y:oPct.y, w:oPct.w/2, h:oPct.h}, target:o,
             otherPart:{x:oPct.x+oPct.w/2, y:oPct.y, w:oPct.w/2, h:oPct.h}}; break; }
      if(Math.abs(wr.left-or.right) < SNAP_DIST){
        z = {type:'insert', zone:{x:oPct.x+oPct.w/2, y:oPct.y, w:oPct.w/2, h:oPct.h}, target:o,
             otherPart:{x:oPct.x, y:oPct.y, w:oPct.w/2, h:oPct.h}}; break; }
    }
  }
  if(z){
    snapZone = z;
    const stage = grid.parentElement;
    let g = stage.querySelector('.snap-ghost');
    if(!g){ g = document.createElement('div'); g.className='snap-ghost'; stage.appendChild(g); }
    g.className = 'snap-ghost' + (z.type!=='edge' ? ' '+z.type : '');
    g.style.left=z.zone.x+'%'; g.style.top=z.zone.y+'%'; g.style.width=z.zone.w+'%'; g.style.height=z.zone.h+'%';
    g.style.display='block';
  } else clearSnap();
}
/* 剩余空间计算：edge 半区落位后，其余窗口竖排均分填满另一半；
   顶部最大化无剩余空间 → 他窗原位保留（在底下，属用户当前操作的自然结果） */
function fillRemaining(zone, exclude){
  if(zone.w >= 100) return;
  const rx = zone.x===0 ? zone.w : 0;
  const others = runWins().filter(w=>w!==exclude);
  const n = others.length; if(!n) return;
  others.forEach((w,i)=>{ setWinRect(w, {x:rx, y:i*(100/n), w:100-zone.w, h:100/n}); flash(w); });
}

  const box = document.getElementById('mtBox');

}

/* dock 状态的局部同步：只动 #aiDock 自身与 run 页两处跟随者（AI 标签选中态 / ai-fab），
   绝不 render() —— 否则内容区被整体重建，设置页会重播 swap-in 淡入，产生"刷新"观感（S2 纪律）。
   rebuild=true 时重建 dock 内容（ai 模式切换会换 seg/权限条/文案），重建后补挂手柄。 */
function applyDockLocal(rebuild){
  const dock = document.getElementById('aiDock');
  if(!dock) return;
  dock.className = 'ai-dock' + (state.aiDock ? '' : ' collapsed') + (state.aiDockForced ? ' force-open' : '');
  if(rebuild) dock.innerHTML = aiDockHtml();
  document.querySelectorAll('.apptab[data-v="ai"]').forEach(b=>
    b.classList.toggle('on', state.aiDock && state.aiMode === 'workspace'));
  const stage = document.querySelector('.stage');
  if(stage){
    const fab = stage.querySelector('.ai-fab');
    if(state.aiDock){ if(fab) fab.remove(); }
    else if(!fab) stage.insertAdjacentHTML('beforeend',
      `<button class="ai-fab" data-act="toggle-dock">${ico('sparkle',16)} AI 助手</button>`);
  }
  mountHandles();
}
/* dock 展开⇄折叠的唯一路径：rail 按钮、运行模式 AI 标签共用，保证同一种手感
   展开：Width first，Content 约 120ms 后出现；收起：Content 先淡出，Panel 再收缩 */
function toggleAiDock(fromRunTab){
  const dock = document.getElementById('aiDock');
  if(state.aiDock && !(fromRunTab && state.aiMode !== 'workspace')){
    /* 工作模式 AI 标签的 on 态 = 已展开且是工作空间助手；
       展开着却是聊天模式时，点标签先切到工作空间助手而不是折叠 —— 视觉态与点击结果一致 */
    dock.classList.add('collapsing');
    setTimeout(()=>{
      state.aiDock = false; state.aiDockForced = false;
      applyDockLocal(false);                     /* 局部收起，内容区不动 */
    }, mtMs('--mt-dur-ai-out', 200));
  } else {
    state.aiDock = true; state.aiDockForced = true;
    if(fromRunTab) state.aiMode = 'workspace';
    applyDockLocal(false);                       /* 类切换即展开，面板 DOM 本来就在 */
    const d = document.getElementById('aiDock');
    d.classList.add('just-expanded');
    setTimeout(()=>d.classList.remove('just-expanded'), mtMs('--mt-dur-ai', 260) + 200);
  }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  if(!ACTIONS[act]) return;
  /* 分段控件在文件里有两种写法：
     ① 按钮自己带 data-act + data-v（如 ai-mode / layout / run-mode）
     ② 容器带 data-act，按钮只带 data-v（如 set-motion / set-layout）
     写法②下 closest('[data-act]') 命中的是容器，d.v 永远是 undefined ——
     所以在这里统一把"被点按钮"的 v 补进 payload，handler 只管读 d.v。 */
  const btn = e.target.closest('button[data-v]');
  let ds = el.dataset;
  if(btn && el.contains(btn)){
    ds = {};
    for(const k in el.dataset) ds[k] = el.dataset[k];
    ds.v = btn.dataset.v;
  }
  if(act === 'menu'){ e.stopPropagation(); ACTIONS.menu(ds, el); return; }
  ACTIONS[act](ds, el, e);
});
/* 主题切换：标题栏按钮与设置里的分段控件必须走同一个函数。
   之前两条路径各写各的，设置那条漏了 dataset.theme —— 于是"在设置里切主题没反应"。*/
function setTheme(v){
  const real = v === 'system'
    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    : v;
  state.theme = v;
  document.documentElement.dataset.theme = real;
  document.querySelectorAll('[data-act="theme-seg"] button').forEach(b=>b.classList.toggle('on', b.dataset.v === v));
  announce(real === 'dark' ? '已切换到深色主题' : '已切换到浅色主题');
}
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
  setTheme(cur === 'dark' ? 'light' : 'dark');   // 整屏颜色都变了，再弹一条提示是噪音
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act="theme-seg"] button');
  if(t) setTheme(t.dataset.v);
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    /* 弹层优先：picker 等抽屉开着时 Esc 只关弹层；否则档案编辑态 Esc = 取消编辑卡 */
    if(layer.firstChild && !layer.dataset.closing){ closeCtx(); closeLayer(); return; }
    const ed = document.getElementById('profileEditor');
    if(state.profile.editing && ed && ed.firstChild){ ACTIONS['profile-cancel'](); return; }
    closeCtx(); closeLayer();
  }
});

.rsh:hover::after,.rsh:focus-visible::after,.rsh.on::after{opacity:1;transform:scaleY(1)}
.rsh:focus-visible{outline:none}
/* ★ 触摸设备（平板 / 触屏）没有 hover —— "hover 才显形"等于永远不显形。
   这里让把手常驻（半透明），并把命中区从 9px 加宽到 24px，否则手指点不中。 */
@media (hover: none){
  .rsh{width:24px}
  .rsh::before{width:2px;background:var(--border-strong)}
  .rsh::after{opacity:.55;transform:scaleY(1)}
  .rsh.on::after{opacity:1}
  .rsh.on::before{background:var(--brand-500)}
}
.rsh.on::before{width:2px;background:var(--brand-500)}
/* 到达最小值后进入"蓄力"：线在 dwell 时长内匀速涨粗，满了就折叠。
   ★ 没有这段反馈，用户只会觉得"怎么突然就折叠了"。 */
.rsh.arming::before{animation:rshArm var(--mt-dur-dwell) linear forwards}
/* 蓄力 = 折叠阈值上的"中间态"。线涨粗 + 光环 + 把手胶囊常亮 ——
   必须一眼看出"正在逼近折叠"，且来得及松手反悔（dwell 560ms）。 */
.rsh.arming::after{opacity:1;transform:scaleY(1)}
@keyframes rshArm{
  from{width:2px;background:var(--brand-500);box-shadow:none}
  to{width:6px;background:var(--brand-600);box-shadow:0 0 0 4px var(--brand-100)}
}
.rsh--nav{right:0}        /* 导航侧栏：右边界，向右拖变宽 */
.rsh--widget{left:0}      /* 组件区：左边界，向左拖变宽 */
.rsh--ai{left:0}          /* AI 侧栏：左边界，向左拖变宽 */
/* ★ 折叠态拖拽的"阈值线"：边界点亮（3px 主色 + 把手胶囊常亮），
   到达阈值时换成 .crest 脉冲提示 —— 阈值不是隐藏参数，是看得见的手感。 */
.rsh.pull::before{width:3px;background:var(--brand-500)}
.rsh.pull::after{opacity:1;transform:scaleY(1)}
/* 到达完全展开宽度：边缘脉冲一下（提示 + 停顿见 flush() crestUntil 段）。
   提示是交互反馈不是装饰动画：宽度/描边变化，reduced 档仍有淡变，off 档只剩停顿本身。 */
.rsh.crest::before{animation:rshCrest 560ms var(--mt-ease-out)}
.rsh.crest::after{opacity:1;transform:scaleY(1)}
@keyframes rshCrest{
  0%{width:2px;background:var(--brand-500);box-shadow:none}
  35%{width:6px;background:var(--brand-600);box-shadow:0 0 0 4px var(--brand-100)}
  100%{width:2px;background:var(--brand-500);box-shadow:none}
}
/* 折叠 / 隐藏时不给拖：一个能拖却没反应的手柄，比没有手柄更糟。
   ★ 但 mini 态的导航手柄要留着 —— 主动折叠按钮已经删了，拖边界是唯一的展开途径。
   ★ AI 折叠态（48px 竖条）的手柄同样留着：拖它是"拉出展开过程"的唯一入口，
     藏掉 = 折叠后永远无法再展开。展开动画由 rebuildAi 的 dock-appear 负责。
   ★ 工作模式（cinema）下才整体收掉：那是沉浸态，不该被调宽窄。 */
.shell.cinema .rsh--nav,
.shell.cinema .rsh--widget,
.widget-col.collapsed .rsh--widget{display:none}
/* 窄屏下宽度被媒体查询写死，此时拖不动 —— 同理把手柄收掉，不留"假可拖" */
@media (max-width:1300px){ .rsh--widget{display:none} }
@media (max-width:1180px){ .rsh--ai{display:none} }
@media (max-width:1100px){ .rsh--nav{display:none} }
body.is-resizing{cursor:col-resize;user-select:none}
body.is-resizing *{cursor:col-resize!important}
body.is-resizing .sidebar,
body.is-resizing .widget-col,
body.is-resizing .ai-dock,
body.is-resizing .rsh::before{transition:none!important}
/* ★ 高亮只能落在"正在拖的那一个"上。写成 .rsh::before 会把所有手柄一起点亮 ——
   级联挤压折叠掉某栏后，那栏的手柄还在（mini 态本来就要留着当展开入口），
   于是出现"两条边缘同时选中"。 */
body.is-resizing .rsh.on::before{width:2px;background:var(--brand-500)}
/* 拖拽中，其余手柄彻底不响应：既不会误触，也不会被 hover 点亮成第二个选中态 */
body.is-resizing .rsh:not(.on){pointer-events:none}
body.is-resizing .rsh:not(.on)::after{opacity:0}
/* ★ 正在拖的那根**永不被隐藏**。手柄一旦消失，指针捕获就丢了，
   pointerup 再也收不到 → 拖拽态残留 → 其余手柄全被锁死。
   （AI 折叠态已不再藏手柄，此规则留作兜底防御。） */
body.is-resizing .rsh.on{display:block!important}

.progress-fill{transition:width var(--mt-dur-modal) var(--mt-ease-out)}

/* ---- 设置分类切换：只有内容区动，导航与页头不动 ---- */
.set-body.swap-in{animation:swapIn var(--mt-dur-modal) var(--mt-ease-out) both}
@keyframes swapIn{from{opacity:var(--mt-fade-from);transform:translateX(calc(var(--mt-dist-float) * -1))}to{opacity:1;transform:none}}

/* ---- Skin Lab（default-skin.md §五）：--mt-skin-* 预览通道的演示层 ---- */
/* 通道桥接：皮肤参数只经 --mt-skin-* 进入沙箱；fallback = Default 基线（零覆盖即默认档） */
.skin-sandbox{
  --mt-intensity: var(--mt-skin-intensity, 1);
  --mt-stagger:   var(--mt-skin-stagger, 24ms);
}
.skinlab-swatches{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);align-items:center}
.skinlab-swg{font-size:var(--fs-label);letter-spacing:var(--ls-label);color:var(--text-4);margin-right:2px}
.skinlab-sw{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-caption);color:var(--text-3);font-family:var(--font-mono)}
.skinlab-sw i{width:14px;height:14px;border-radius:var(--r-xs);border:0.5px solid var(--border);display:inline-block;flex:none}
.skinlab-ws{
  background:var(--bg-sunken);border:0.5px solid var(--border-subtle);border-radius:var(--r-xl);
  padding:var(--pad-card);display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--space-4)
}
.skinlab-win{
  background:var(--surface-1);border:0.5px solid var(--border-subtle);border-radius:var(--r-md);
  box-shadow:var(--shadow-xs);overflow:hidden;transition:box-shadow var(--mt-dur-hover) var(--mt-ease-out)
}
.skinlab-win:hover{box-shadow:var(--shadow-md)}
.skinlab-win-bar{
  display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--surface-2);
  border-bottom:0.5px solid var(--border-subtle);font-size:var(--fs-caption);color:var(--text-3)
}
.skinlab-dot{width:8px;height:8px;border-radius:50%;flex:none}
.skinlab-win-row{height:8px;border-radius:4px;background:var(--surface-3);margin:12px 14px 0}


/* ---- 启动应用：本地 loading（>200ms 才出现指示，永不整页遮罩） ---- */
.launching{position:relative;pointer-events:none}
.launching::after{
  content:'';position:absolute;right:8px;bottom:8px;width:14px;height:14px;border-radius:50%;
  border:1.6px solid var(--border-strong);border-top-color:var(--brand-500);
  animation:spin .7s linear infinite
}
[data-motion="off"] .launching::after{animation:none}

/* ---- Motion Showcase / Guard 演示台 ---- */
.mt-stage{
  display:grid;place-items:center;min-height:132px;border-radius:var(--r-lg);
  background:var(--surface-2);border:1px solid var(--border-subtle)
}
.mt-box{
  width:132px;height:64px;border-radius:var(--r-lg);display:grid;place-items:center;
  background:var(--brand-50);border:1px solid var(--brand-200);
  font-size:var(--fs-caption);color:var(--brand-700);text-align:center;padding:0 8px
}
.mt-row{
  display:flex;align-items:center;gap:var(--space-4);padding:var(--space-3) var(--space-5);
  border-bottom:1px solid var(--border-subtle)
}
.mt-row:last-child{border-bottom:0}
.mt-row .main{flex:1;min-width:0}
.mt-box.mt-press{animation:mtPress calc(var(--mt-dur-press) * 2) var(--mt-ease-out)}
@keyframes mtPress{0%{transform:scale(1)}50%{transform:scale(var(--mt-scale-press))}100%{transform:scale(1)}}
.mt-box.mt-hover{animation:mtHover var(--mt-dur-hover) var(--mt-ease-out) both}
@keyframes mtHover{from{transform:translateY(0)}to{transform:translateY(calc(var(--mt-dist-hover) * -1))}}
.mt-box.mt-cinema{animation:winIn 560ms var(--mt-ease-emphasis) both}
.mt-box.mt-slide{animation:mtSlide var(--mt-dur-reorder) var(--mt-ease-out) both}
@keyframes mtSlide{from{transform:translateX(var(--mt-dist-panel))}to{transform:none}}
.mt-box.mt-toast,.mt-box.mt-ctx{animation:toastIn var(--mt-dur-toast-in) var(--mt-ease-out) both}
.mt-box.mt-drawer{animation:drawerIn var(--mt-dur-drawer) var(--mt-ease-out) both}
.mt-box.mt-modal{animation:mtModal var(--mt-dur-modal) var(--mt-ease-out) both}
@keyframes mtModal{from{opacity:0;transform:translateY(var(--mt-dist-modal)) scale(var(--mt-scale-float))}to{opacity:1;transform:none}}
.mt-box.mt-ai{animation:dockIn var(--mt-dur-ai) var(--mt-ease-out) both}

/* 卡片尺寸演示用：--mt-dist-panel 默认 24px，档位切换后自动变小/归零 */
.mt-stage .mt-box{will-change:transform}
/* 三档对比页里被选中的卡片：Selected 是静态描边，禁止呼吸动画 */
.card.sel{border-color:var(--brand-200);box-shadow:0 0 0 3px var(--brand-50)}
</style>
